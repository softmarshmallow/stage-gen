# A game-directed scrolling-preview run.
#
# Everything about this run's look, build, and cast rules lives in the bound game contract
# rather than in this file: see library/games/whimsical-storybook-fantasy/game.toml.
#
#   uv run stage-gen generate --input examples/scrolling-preview/game-directed-village.toml \
#     --game-library-root .
#
# After editing a bound source, update its source_sha256 lock. Map edits first update their lock
# in maps/index.toml, then update the map_book lock here. Validate the complete closure with:
#   uv run python scripts/validate_game_package.py --root .
