[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stage-gen"
version = "0.0.0"
description = "Headless, reproducible 2D game-asset generation pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "stage-gen contributors" }]
dependencies = [
  "jsonschema>=4.26,<5",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.13,<5",
]

[project.scripts]
stage-gen = "stage_gen.interfaces.cli:entrypoint"

[dependency-groups]
dev = [
  "types-jsonschema>=4.26,<5",
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.11,<1",
]
games = ["demo-game-collection"]
apps = ["stage-gen-concept"]

[tool.uv.workspace]
members = [
  "godot/packages/scenario_runtime/authoring",
  "godot/games/_shared/python",
  "godot/games/bellweather/pipeline",
  "godot/games/iron_petal_unit/pipeline",
  "godot/games/ember_hollow/pipeline",
  "godot/games/the_grain/pipeline",
  "godot/tools/python",
  "apps/concept_studio",
]

[tool.uv.sources]
demo-game-collection = { workspace = true }
stage-gen-concept = { workspace = true }

[tool.hatch.build]
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hooks.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gnode", "src/stage_gen"]
# A target's exclude replaces the build-wide list, so the wheel repeats it. Workflow prose
# (page.mdx, contract.md) is read from the checkout by the site, never by installed code.
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
  "/src/stage_gen/workflows/**/*.mdx",
  "/src/stage_gen/workflows/**/contract.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/LICENSE",
  "/README.md",
  "/VERIFICATION.md",
  "/pyproject.toml",
  "/docs/**/*.json",
  "/docs/**/*.md",
  "/examples/**/*.py",
  "/examples/**/*.md",
  "/scripts/**/*.py",
  "/src/gnode/**",
  "/src/stage_gen/**",
  "/tests/**/*.json",
  "/tests/**/*.py",
]
exclude = [
  "/src/stage_gen/**/inputs/**/references/**",
  "/src/stage_gen/workflows/universe/inputs/lantern_ferry/**",
  "/.env",
  "/.git/**",
  "/.mypy_cache/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/.venv/**",
  "/build/**",
  "/dist/**",
  "/example-output/**",
  "/fixtures/**",
  "/node_modules/**",
  "/web/**",
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.tsbuildinfo",
  "**/qa-screenshots/**",
  "**/screenshots/**",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: opt-in test that calls a hosted provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["gnode", "stage_gen", "scenario_authoring", "demo_game_tools", "demo_game_collection", "bellweather_pipeline", "iron_petal_unit_pipeline", "ember_hollow_pipeline", "the_grain_pipeline", "concept_studio"]

[tool.ruff.lint.per-file-ignores]
# Emits HTML whose Tailwind class lists stay single literal strings, so its lines run long.
"apps/showcase/showcase/components.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
