# Only what the code cannot know. Steps, identity and the sample plan live in workflow.py.
schema_version = 1
kind = "stage-gen-workflow-v1"
id = "storefront"
title = "Storefront"
promise = "A game's own art and a short brief in. Store icon, stills, banner and listing copy out."
summary = """
One reading of the game's reference art becomes a direction every surface inherits. Each \
surface is drawn from its own brief, cut to its exact store canvas, checked and reviewed, and \
the listing copy is written beside them."""

[[outputs]]
artifact_ref = "package/surfaces/app_icon.png"
description = "Each surface at the exact canvas its store asks for"

[[outputs]]
artifact_ref = "package/listing.json"
description = "The listing copy"

[[outputs]]
artifact_ref = "package/inventory.json"
description = "Every surface and reference in the closed package"
