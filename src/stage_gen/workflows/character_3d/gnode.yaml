# The character-3d workflow's home. Its node modules import Stage Gen's character-3d
# component (the Blender worker, the studios, the profiles' rules), so that counts as its
# source: gnode.lock notices when it changes.
gnode: project/v1
sources: [stage_gen]
routes:
  agent.turn: openai/gpt-6-astra@openrouter
  image.generate: openai/gpt-image-2.5-sunburst@openrouter
  image.edit: openai/gpt-image-2.5-sunburst@openrouter
  mesh.generate: P2-20260801@tripo
  mesh.rig: v1.0-20240301@tripo
