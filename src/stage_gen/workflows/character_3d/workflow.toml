# Only what the code cannot know. The implementation is frozen at stage_gen.recipes.character_3d;
# steps and identity are read from it as text in workflow.py.
schema_version = 1
kind = "stage-gen-workflow-v1"
id = "character-3d"
title = "3D character"
promise = "One written brief in. One rigged, reviewed character out."
summary = """
An agent draws reference views, a 3D service builds a textured mesh from them, and the mesh is \
stood upright, rigged and given test clips. Independent reviewers judge every stage on renders \
in the export's own finish, and the export is admitted only when numbers and pictures both pass."""

[try]
input = "An original character brief as an experiment JSON beside its inputs, and a Blender install"
commands = [
  "stage-gen run character-3d --experiment characters/my_character_01.json --input-root characters --run-root out/character-try --blender /Applications/Blender.app/Contents/MacOS/Blender --admission-mode development --prepare-only",
  "stage-gen inspect out/character-try",
]

[[tools]]
name = "Blender"
role = "Normalises, audits, renders and exports every mesh"

# The node types and their titles are built inside the frozen implementation. The spike/ and
# part_request/ types appear only in the tavi-parts example, made with an earlier version.
[labels]
"3d/character/runtime_admit" = "Probe Blender"
"3d/character/brief_preflight" = "Check the brief"
"3d/character/reference_agent" = "Draw references"
"3d/character/reference_review" = "Review references"
"3d/character/references_admit" = "Admit references"
"3d/character/generate_part" = "Generate mesh"
"3d/character/normalize" = "Measure the part"
"3d/character/part_review" = "Review mesh"
"3d/character/part_admit" = "Admit mesh"
"3d/character/parts_admit" = "Admit parts"
"3d/character/assemble_agent" = "Orient and ground"
"3d/character/assembly_review" = "Review orientation"
"3d/character/assembly_admit" = "Admit orientation"
"3d/character/assembly_select" = "Select the assembly"
"3d/character/adopt_assembly" = "Adopt the admitted assembly"
"3d/character/provider_rig_submit" = "Submit for rigging"
"3d/character/provider_rig_collect" = "Collect and audit rig"
"3d/character/rig_agent" = "Build the rig"
"3d/character/rig_review" = "Review rig"
"3d/character/regenerate_whole" = "Regenerate mesh"
"3d/character/recovery_part_review" = "Review mesh"
"3d/character/recovery_part_admit" = "Admit mesh"
"3d/character/recovery_assemble" = "Orient and ground"
"3d/character/recovery_assembly_review" = "Review orientation"
"3d/character/recovery_assembly_admit" = "Admit orientation"
"3d/character/rig_admit" = "Admit export"
"3d/character/rig_select" = "Select the export"
"part_request/generate_part" = "Generate a part"
"spike/character.runtime_admit" = "Probe Blender"
"spike/character.normalize" = "Measure the part"
"spike/character.assemble_agent" = "Fit the parts"
"spike/character.assembly_review" = "Review the fit"
"spike/character.assembly_admit" = "Admit the fit"
"spike/character.rig_agent" = "Build the rig"
"spike/character.rig_review" = "Review rig"
"spike/character.rig_admit" = "Admit export"

[[outputs]]
artifact_ref = "candidates/rig_01/animated.glb"
description = "The character: textured mesh, skeleton and short clips, at game scale"

[[outputs]]
artifact_ref = "candidates/"
description = "Every attempt the run made, including refused ones"

[[outputs]]
artifact_ref = "references/"
description = "The reference sheet and the front and back views"

[[outputs]]
artifact_ref = "observations/"
description = "The renders each reviewer looked at"

[[outputs]]
artifact_ref = "nodes/"
description = "One record per step, with what each reviewer checked and why"

[[outputs]]
artifact_ref = "outcome.json"
description = "How the run ended and what it cost"

