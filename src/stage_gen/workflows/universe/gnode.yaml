# The universe workflow's home. Its node modules import Stage Gen's universe models and
# medium contracts, so those count as its source: gnode.lock notices when they change.
gnode: project/v1
sources: [stage_gen]
routes:
  structured.generate: openai/gpt-5.6-sol@openrouter
  image.generate: openai/gpt-image-2.5-sunburst@openrouter
