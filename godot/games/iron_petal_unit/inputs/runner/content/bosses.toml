# Halcyon Arbor has no enemies, so its boss is not one: the canopy pruner is
# maintenance equipment that lost its schedule and kept working. It blocks the
# rescue line because it is doing its job in the wrong place, which is why it
# can be driven off rather than destroyed, and why its shots are seed pods.
[[bosses]]
boss_id = "canopy_pruner"
display_name = "Runaway Canopy Pruner"
body_kind = "overgrown_machine"
height_units = 2.6
reference_ids = ["greenhouse_runway"]
prompt = "A large derelict greenhouse canopy-pruning rig hanging in the air on four tired ducted lift fans, cream ceramic housing with coral bands and graphite vents matching the greenhouse equipment, a wide blunt trimming head of folded shears at the front, thick bramble and pale roots grown through its frame and trailing from its underside, one mint status lens glowing at the front like a single calm eye. It is far larger than the operator it blocks, filling the height of the bay it hangs in. It is machinery that lost its schedule, never a creature: no face, no jaw, no limbs, no armour, no weapon barrels. It faces LEFT, presenting its trimming head and its lit lens toward the left edge of the frame."

