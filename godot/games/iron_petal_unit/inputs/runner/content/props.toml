prompt = "Exactly one narrow mechanically connected hanging greenhouse mist-nozzle assembly: one cream top coupling, one short coral pipe, and two compact graphite spray heads attached directly side by side to the same small bottom manifold, with one mint indicator bead and a few short trailing leaves. No second vertical unit, duplicate nozzle, floating head, or hardware joined only by water. The bottom-most painted pixels must form one flat hard contiguous metal nozzle lip. Emit no mist, stream, droplets, glow, or particles below it. It is a one-column overhead slide obstacle; the alpha-over-64 painted width must be no more than half of its painted height, with no arch, long crossbar, support legs, ceiling, scenery, or horizontal spill. Strict side view, one connected object, generous true zero-alpha exterior, no floor, text, logo, or watermark."

