# -------------------------------------------------------------- interactions
#
# Order matters where two interactions share a trigger: the runtime dispatches
# a click to the first available one, so the earlier shadows the later until it
# has fired. That is how Bell answers three questions in order, how the torn
# piece can be read and then — by a Henry who decides to — pulled free, and how
# the lift refuses to be an exit until Henry has seen what is in the glass.

[[interactions]]
on = { verb = "inspect", hotspot = "six_figures" }
effects = []
narration = """Six mannequins remain where Henry saw them on the way in. They \
face the empty seventh chair. Bell stops several feet from the glass. "I thought \
they'd finished it." Edwin asks him what. "The window. I thought they'd put \
another figure in.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "paper_moon" }
effects = [{ set_flag = "window_changed" }]
narration = """Behind the empty seventh chair, the white paper moon has split and \
sagged inward. Paper moves slightly where it has torn."""

[[interactions]]
on = { verb = "inspect", hotspot = "the_man" }
effects = [{ set_flag = "saw_body" }]
narration = """There is a man beneath it. His body lies partly behind the chair, \
one shoulder against its steel base. A shoe extends into the light. One hand \
rests palm down on the display floor. His clothing has the softness the \
mannequins' clothing lacks. Henry steps closer to the glass. The face is \
Paul's."""

[[interactions]]
on = { verb = "inspect", hotspot = "stage_door" }
effects = [{ set_flag = "stage_door_locked" }]
narration = """Bell takes a ring of keys from his belt and unlocks a narrow door \
beside his booth. It opens onto the display stage. "This is the only door down \
here." Henry asks whether it was locked. "Yes." How he knows. "Because I opened \
it." Henry looks at him. "Only far enough to see his face. Then I locked it and \
called upstairs." Who else has that key. "Mr. Price. The display chief in the \
morning." Edwin removes a smaller key from a second ring and holds it where \
Henry can see it. "My display-stage key has not left me.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "under_the_jaw" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "touched_neck" }]
narration = """Henry kneels beside Paul. He touches two fingers beneath the jaw, \
waits, then withdraws them. He does not move the body. Edwin says his name from \
the doorway. Henry looks at him and shakes his head once. Bell reaches for his \
cap, remembers it is not there, and lowers his hand."""

[[interactions]]
on = { verb = "inspect", hotspot = "gallery_carton" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "carton_on_gallery" }]
narration = """Henry looks up. The paper moon hangs from a scenic wall that rises \
to the cosmetics floor. Near the top, an open section of gallery rail makes a \
black rectangle. A shallow carton sits on the gallery beside it."""

[[interactions]]
on = { verb = "inspect", hotspot = "steel_lip" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "marks_under_lip" }]
narration = "Beneath the steel lip are pale horizontal marks."

[[interactions]]
on = { verb = "inspect", hotspot = "painted_wall" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "scrape" }]
narration = "Lower down, one long scrape crosses the painted wall."

[[interactions]]
on = { verb = "inspect", hotspot = "call_button" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "red_button" }]
narration = "A red button is mounted beside the open rail."

# The paper, read. The novel's Henry stops here.
[[interactions]]
on = { verb = "inspect", hotspot = "torn_piece" }
requires = ["stage_door_locked"]
effects = [{ set_flag = "heading_int_bedroom" }]
narration = """Henry looks back at Paul. A torn piece of typed paper, creased \
where his hand closed on it, remains beneath the fingers of his right hand. \
Enough of the top edge is visible to read: INT. BEDROOM — NIGHT. It is not a \
letter. The rest of the line is under the hand."""

# The paper, pulled free. Ours may. It is the one thing in this room the novel
# refuses, and it is on the record from the moment he does it.
[[interactions]]
on = { verb = "inspect", hotspot = "torn_piece" }
requires = ["stage_door_locked", "heading_int_bedroom"]
effects = [
    { set_flag = "pulled_the_paper" },
    { set_flag = "touched_more_than_said" },
]
narration = """Henry puts one finger under the creased edge and draws the paper \
out from beneath the hand. Half a line more, and no name anywhere on it, and now \
his own prints are on it as well as Paul's."""

[[interactions]]
on = { verb = "inspect", hotspot = "access_door" }
effects = [{ set_flag = "access_door_unlocked" }]
narration = """Henry turns toward the service entrance. From the vestibule, the \
lift is on the left. On the right is a plain door marked DISPLAY ACCESS. He asks \
whether it is locked. "Not while a window is unfinished." Where it goes. Bell \
points upward. "There is a short stair behind it. That goes to the gallery.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "wired_glass" }
effects = [{ set_flag = "whiting_on_treads" }]
narration = """Through the wired-glass pane in the access door, Henry can see the \
enclosed stair turn upward behind the scenery. Something white has been tracked \
down the lower treads. At the top of the stair is the same black opening above \
Paul's body. The shallow carton sits just beyond it."""

# Bell answers what he is asked, in order, and repeats it shorter.
[[interactions]]
on = { verb = "inspect", hotspot = "mr_bell" }
effects = [{ set_flag = "bell_key_path" }]
narration = """Mr. Bell is perhaps sixty and has forgotten to put on his cap. \
Henry asks him to say what happened when Mr. Ellery came downstairs. "Mr. Ellery \
came out of the lift with his sister." Henry gives him the name. "Yes, sir. I \
gave him the carton. He needed both hands, so he gave her the lift key.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "mr_bell" }
requires = ["bell_key_path"]
effects = [{ set_flag = "bell_in_receiving" }]
narration = """"They were beside the display-access door when I went into \
receiving to make the closing call. Then I crossed the court to check the \
windows." Henry asks when he saw Mr. Ellery again. Bell looks through the glass. \
"There." And Miss Ellery. "Not after I gave them the carton.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "mr_bell" }
requires = ["bell_in_receiving"]
effects = [{ set_flag = "court_door_never_opened" }]
narration = """Edwin asks whether he opened the motor-court door for him. "No." \
Henry asks whether Mr. Ellery asked him to. "No, sir." Edwin looks at the brass \
key in his own hand. "Mr. Bell never opened the door." "No.\""""

[[interactions]]
on = { verb = "inspect", hotspot = "mr_bell" }
requires = ["court_door_never_opened"]
effects = []
narration = "A distant police siren becomes audible beyond the stone canopy."

# The exit. It shadows the plain look at the lift as soon as Henry has seen the
# man, and not before: there is no leaving this room without having gone in.
[[interactions]]
on = { verb = "inspect", hotspot = "service_lift" }
requires = ["saw_body"]
effects = [{ set_flag = "left_the_room" }]
narration = """Henry leaves the display and Bell locks the door again. Through \
the glass, the six mannequins continue facing the seventh place."""

[[interactions]]
on = { verb = "inspect", hotspot = "service_lift" }
effects = []
narration = "The lift opens onto a narrow vestibule behind the motor court."

[win]
requires = ["left_the_room"]
narration = """Henry has attended the supper for less than two hours. For the \
first time that evening, he is working."""
