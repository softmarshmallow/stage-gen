# Episode One, Movement V — The window.
#
# The Grain, Chapter Five, Scene 9. Wednesday 27 September 1972, about half
# past nine. Henry has come down the service lift with Edwin and is standing in
# the motor court of a closed department store, looking into an unfinished
# display window with a man inside it.
#
# `inspect` only. There is nothing to use and nothing to carry: the pocketknife
# is a fact, not an item, and no inventory crosses a beat boundary. Every look
# is optional and exports one fact, except the man, whom the exit requires.
# Every narration line is authored from the novel — nothing here is a gap for
# the pipeline to fill.
#
# The one place the player's Henry may exceed the novel's Henry is the torn
# piece of paper. The novel's Henry does not pull it free. Ours may, and it
# costs him: it sets `touched_more_than_said`, and the uniformed officer's
# "What did you touch?" is then a different exchange with a longer answer.

schema_version = 1
kind = "pointclick-room-v3"
room_id = "e1_window"
display_name = "The Window"
revision = 1

# The art direction of record, as pixels. This is the same plate the whole
# pilot is drawn against, and it is a picture of this very window on the way
# in — the moon whole, the rail already open. Drawing the "after" against the
# "before" is the point: a player who looked at the window at a quarter to
# eight should recognise the frame and see exactly what has changed in it.
[[references]]
reference_id = "cover_style"
source = "references/cover.png"
source_sha256 = "764c0c4e185155615f1f46623ab59afca506721d3a08495a20550bcf47dff559"
rights_status = "unreviewed"
rights_basis = [
    "Original brand-neutral prompt composed from this production's art direction, with no third-party image input.",
    "First-party AI-generated plate selected by the production lead from a six-candidate style sheet on 2026-09-03.",
    "No independent semantic review of the exact committed bytes is recorded; the image is unreviewed and unpublished.",
]

[style]
label = "screen-printed poster, four flat inks, 1972 Los Angeles at night"
keywords = [
    "large flat areas of unmodulated ink with hard cut edges",
    "slight registration offset and visible ink grain at the edge of every shape",
    "shadow drawn as a flat shape, never as a darkening",
    "warm amber interior against cold slate glass and street, carried by solid black",
    "cream, warm amber, deep oxblood and cold slate blue, and nothing else",
    "1972 fixtures and wardrobe",
]
avoid = [
    "photorealism",
    "anime",
    "painterly brushwork or visible brush texture",
    "gradients, blends, or airbrushed transitions",
    "drawn pen outlines or comic ink linework",
    "gloss or neon",
    "a paper margin, border or visible edge of stock around the image",
    "readable text or branding",
    "blood or injury",
    "horror lighting",
]
reference_ids = ["cover_style"]

# One painting holds the whole of Scene 9, because Scene 9 is one place seen
# from one standing position: the motor court, the window, and — through the
# open service door on the left — the narrow vestibule the lift came down to.
# The two sprite objects (the carton on the gallery, the torn piece under his
# hand) are deliberately absent from this brief; each is composited into its
# own clearance zone.
[scene]
brief = """OUTDOORS at night, in the open motor court of an original closed 1972 \
department store, and unmistakably outdoors: a heavy stone porte-cochere canopy \
overhead lit from beneath by small recessed lamps, wet dark paving underfoot \
reflecting the window light, and the cold blue-black city street visible past the \
canopy piers. Not a lobby, not an interior, no polished floor and no ceiling but \
the canopy soffit. This is the same court as the establishing plate, seen closer. Straight ahead, a tall display \
window glows amber against cold blue-black stone and empty street: inside it six \
blank-faced mannequins in evening dress, four standing and two seated on low \
plinths, are turned inward toward an empty seventh chair. That chair is a MODERN \
PEDESTAL CHAIR: a plain upholstered seat carried on ONE polished steel column \
rising from a single round steel foot. It has no four legs, no turned wood and \
no gilt frame. The dead man's shoulder rests against that steel column, and behind the chair a large matte white paper moon, \
flat and papery with no craters, has split across its middle and sagged inward. A man in a dark suit lies partly behind the chair on the display floor, \
one shoulder against that steel column, a shoe extended into the lamp \
light, one hand palm down; he is at rest and unmarked, painted plainly and \
without injury. Above the window a scenic wall rises to a narrow gallery whose \
rail has a short section left open, a black rectangle, with a small red push \
button mounted beside it; a steel lip runs beneath the gallery and a long scrape \
crosses the painted wall lower down. At the right of the glass, a narrow stage \
door stands ajar beside a guard's booth, and an elderly guard in a gray uniform \
with no cap stands close to the glass, only two or three paces from it. At the left, an open service door \
shows a narrow vestibule holding a service lift and a plain flush door with a \
small wired-glass pane. No readable text, lettering, numerals or branding \
anywhere in the image."""
width = 1280
height = 720

# ------------------------------------------------------------------ hotspots
