# ----------------------------------------------------------------- the stages

[[stages]]
stage_id = "winter_room_after_police"
brief = "The same original top-floor glass-roofed dining room at night after the police have been through it, the round table stripped and the chairs pulled several feet apart and turned away from each other, cups and saucers left exactly where they stood, a yellow pad and a coat over the back of one chair, the open roof panel still open, no people, no readable text or signage"

[[stages]]
stage_id = "private_dining_room"
brief = "A small private dining room off a curved wall in an original 1972 department store, a square table for four, four chairs, a large painted view of a harbor on the far wall, one glass panel beside the door looking back into a larger room, low warm lamplight, no people, no readable text or signage"

[[stages]]
stage_id = "passenger_elevators"
brief = "A lobby of dark passenger elevators in a closed 1972 department store after one in the morning, polished bronze doors unlit, floor indicators dead, a single working ceiling fixture, deep shadow along a marble floor, no people, no readable text, numerals or signage"

[[stages]]
stage_id = "motor_court_screened"
brief = "The motor court of an original closed 1972 department store very late at night, one unmarked sedan left under the stone canopy, a large gray fabric screen fixed over most of the display glass with light escaping around its edges, wet paving, the street beyond cold and empty, no people, no readable text or signage"

# ------------------------------------------------------------------ the audio

[[tracks]]
track_id = "statements"
brief = "Dry and late, after one in the morning. One upright piano, sparse and a little dry, with long rests and single low notes held under a room that has emptied. Eight chairs pushed apart and a notebook closing. Tired rather than sad, and never sentimental. 1972. No drums, no brass, no strings, nothing that resolves"

[tracks.generation]
intent = "generate"
instrumental = true
seamless_loop = true
target_duration_seconds = 90

# ------------------------------------------------------- the flags, imported
#
# Nine. Every one gates an option Henry would otherwise be inventing, and every
# one is a look the player either took or did not:
#
#   eighth_card              Sc3, the card turned toward Lydia
#   ruth_knife_on_plate      Sc5, her knife touching her plate at June's sentence
#   envelope_hear_it         Sc5, "Hear it", Nell's name upside down
#   brass_key_after_dessert  Sc5, Edwin laying the key beside Paul's fork
#   coffee_not_drunk         Sc7, the cup touched to her mouth and set down
#   smear_on_shoe            Sc7, the pale smear Henry reads as carton dust
#   asked_paul_sentence      Sc6, Henry asking Paul after Ruth said no
#   carton_on_gallery        Sc9, the shallow carton beside the open rail
#   heading_int_bedroom      Sc9, INT. BEDROOM — NIGHT, and it is not a letter
#
# `paul_not_to_wait` and `paul_needed_to_think` are deliberately NOT imported:
# both are heard by the whole room in Sc7 and e1_coffee sets them on its only
# path, so a condition on either would always hold. Henry always has both. What
# he does with them is the choice.

[[flags]]
flag_id = "eighth_card"
origin = "imported"

[[flags]]
flag_id = "ruth_knife_on_plate"
origin = "imported"

[[flags]]
flag_id = "envelope_hear_it"
origin = "imported"

[[flags]]
flag_id = "brass_key_after_dessert"
origin = "imported"

[[flags]]
