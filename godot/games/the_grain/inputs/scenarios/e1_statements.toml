# Episode One, Movement VI, second half — Names and addresses. The declarative
# half.
#
# Source: The Grain, Chapter Six, Scenes 11 to 14.
#
# This is the beat the episode exists for, and it is the only one that writes a
# verdict. Nine facts come in from the supper and the window; twenty go out,
# and every one of the twenty is a record of what Henry chose to say to a
# detective who could hear the difference.

schema_version = 2
kind = "scenario-v2"
game_id = "the_grain"
scenario_id = "e1_statements"
display_name = "Names and Addresses"
revision = 1

script = "scenarios/e1_statements.scenario"
script_sha256 = "01bbed7a566ddfa9284ed43f4ce1c53095f6840c32f8d66e7e2862cbcd55c5ab"
