[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "the-grain-pipeline"
version = "0.0.0"
description = "Preparation implementation for the grain pipeline"
requires-python = ">=3.12"
dependencies = ["stage-gen", "demo-game-tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/the_grain_pipeline"]

[tool.uv.sources]
stage-gen = { workspace = true }
demo-game-tools = { workspace = true }
