[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stage-gen-legacy"
version = "0.0.0"
description = "Optional legacy demo builders and contracts for the shared Godot runtime"
requires-python = ">=3.12"
dependencies = ["stage-gen"]

[project.scripts]
stage-gen-legacy = "stage_gen_legacy.interfaces.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["stage_gen_legacy"]

[tool.uv.sources]
stage-gen = { workspace = true }
