[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stage-gen-concept"
version = "0.0.0"
description = "Optional creative workspace application consuming the Stage Gen asset SDK"
requires-python = ">=3.12"
dependencies = ["stage-gen"]

[project.scripts]
stage-gen-concept = "concept_studio.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_studio"]

[tool.uv.sources]
stage-gen = { workspace = true }
