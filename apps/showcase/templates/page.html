<!doctype html>
<html lang="en" class="bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Stage Gen showcase</title>
<link rel="stylesheet" href="../assets/showcase.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body class="font-sans text-[15px] leading-relaxed">

<header class="sticky top-0 z-20 border-b border-zinc-200 bg-white dark:border-zinc-800 dark:bg-zinc-950">
  <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-6">
    <nav class="flex items-center gap-2 text-sm text-zinc-500">
      <a class="hover:text-zinc-900 dark:hover:text-zinc-100" href="../index.html">Showcase</a>
      <span>/</span><span class="text-zinc-900 dark:text-zinc-100">{{title}}</span>
    </nav>
    <div class="flex h-full text-sm" role="group" aria-label="View">
      <button id="to-overview" aria-pressed="true" class="border-b-2 border-transparent px-3 text-zinc-500 aria-pressed:border-zinc-900 aria-pressed:text-zinc-900 dark:aria-pressed:border-zinc-100 dark:aria-pressed:text-zinc-100">Overview</button>
      <button id="to-graph" aria-pressed="false" class="border-b-2 border-transparent px-3 text-zinc-500 aria-pressed:border-zinc-900 aria-pressed:text-zinc-900 dark:aria-pressed:border-zinc-100 dark:aria-pressed:text-zinc-100">Node graph</button>
    </div>
  </div>
</header>

<main id="overview" class="mx-auto max-w-6xl px-6 pb-16 pt-12">
  <h1 class="text-3xl font-semibold tracking-tight">{{title}}</h1>
  <p class="mt-2 text-lg text-zinc-600 dark:text-zinc-400">{{promise}}</p>
  {{related}}
  {{body}}
  <footer class="mt-16 border-t border-zinc-200 pt-6 text-sm text-zinc-500 dark:border-zinc-800">{{footer}}</footer>
</main>

<div id="graph" class="hidden">
  <div class="flex items-center justify-between border-b border-zinc-200 px-6 py-2.5 text-xs text-zinc-500 dark:border-zinc-800">
    <div class="flex flex-wrap items-center gap-5">
      <span class="flex items-center gap-2"><i class="inline-block h-3 w-4 rounded-sm border border-zinc-300"></i>ran</span>
      <span class="flex items-center gap-2"><i class="inline-block h-3 w-4 rounded-sm border border-dashed border-zinc-400"></i>planned, not needed</span>
      <span>Click a node to open its record. Scroll or drag to pan, pinch to zoom.</span>
    </div>
    <div class="flex items-center gap-1">
      <span id="zpct" class="w-10 pr-1 text-right tabular-nums"></span>
      <button id="zout" title="Zoom out" class="size-7 rounded-sm border border-zinc-300 hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-900">−</button>
      <button id="zfit" title="Fit" class="h-7 rounded-sm border border-zinc-300 px-2 hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-900">fit</button>
      <button id="zin" title="Zoom in" class="size-7 rounded-sm border border-zinc-300 hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-900">+</button>
    </div>
  </div>
  <div id="vp" class="relative h-[calc(100vh-6.5rem)] cursor-grab touch-none select-none overflow-clip overscroll-none bg-zinc-50 bg-[radial-gradient(circle,#d4d4d8_1px,transparent_1px)] dark:bg-zinc-900 dark:bg-[radial-gradient(circle,#3f3f46_1px,transparent_1px)]">
    <div id="stage" class="absolute left-0 top-0 flex w-[2280px] origin-top-left flex-wrap items-start gap-x-10 gap-y-14 p-10">
      <svg id="edges" class="pointer-events-none absolute left-0 top-0 z-[1] overflow-visible text-zinc-900 dark:text-zinc-100"></svg>
      {{graph}}
    </div>
  </div>
</div>

<aside id="drawer" class="fixed inset-y-0 right-0 z-30 w-[min(440px,92vw)] translate-x-full overflow-y-auto border-l border-zinc-200 bg-white px-6 pb-10 pt-5 transition-transform dark:border-zinc-800 dark:bg-zinc-950">
  <button id="dx" aria-label="Close" class="absolute right-4 top-3 text-xl text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">×</button>
  <div id="dbody"></div>
</aside>

<script>
const NODES = {{data}};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H5 = "mb-2 mt-7 text-sm font-medium";
const CHECKER = "background-color:#fff;background-image:conic-gradient(#e4e4e7 25%,transparent 0 50%,#e4e4e7 0 75%,transparent 0);background-size:16px 16px";
const human = s => { const t = String(s).replaceAll("_", " "); return t.charAt(0).toUpperCase() + t.slice(1); };
const vp = $("#vp"), stage = $("#stage");
const graphShown = () => !$("#graph").classList.contains("hidden");
let framed = false;

function setView(v) {
  $("#graph").classList.toggle("hidden", v !== "graph");
  $("#overview").classList.toggle("hidden", v === "graph");
  $("#to-overview").setAttribute("aria-pressed", v !== "graph");
  $("#to-graph").setAttribute("aria-pressed", v === "graph");
  // The graph is a canvas: the page under it neither bounces nor goes back on a sideways swipe.
  document.documentElement.classList.toggle("overscroll-none", v === "graph");
  if (v !== "graph" || framed) return;
  framed = true;
  stage.style.opacity = 0;  // not shown until it is arranged
  arrange().then(() => { drawEdges(); frame(false, 0.3, 1); stage.style.opacity = 1; });
}
$("#to-overview").onclick = () => { history.replaceState(null, "", "#"); setView("overview"); };
$("#to-graph").onclick = () => { history.replaceState(null, "", "#graph"); setView("graph"); };

// A box in the stage's own pixels, whatever the camera is doing.
function boxOf(el) {
  let x = 0, y = 0;
  for (let e = el; e !== stage; e = e.offsetParent) { x += e.offsetLeft + (e === el ? 0 : e.clientLeft); y += e.offsetTop + (e === el ? 0 : e.clientTop); }
  return { l: x, t: y, r: x + el.offsetWidth, b: y + el.offsetHeight };
}

// Layout. ELK's layered algorithm places the stages and their cards by what feeds what, and routes
// every edge at right angles around the cards, with one shared trunk where a card fans out or many
// feed one. The page's stages stay as the groups and its rows give the order within them. The graph
// runs to the right, downwards, or to the right and folded into rows, whichever shows it largest:
// many parallel lanes are far taller than a screen running right, and a long chain far wider.
const ELK_SRC = "https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js";
const LAYERED = {
  "elk.algorithm": "layered", "elk.edgeRouting": "ORTHOGONAL", "elk.layered.mergeEdges": "true",
  "elk.spacing.nodeNode": "20", "elk.layered.spacing.nodeNodeBetweenLayers": "56",
  "elk.spacing.edgeNode": "16", "elk.layered.spacing.edgeNodeBetweenLayers": "20",
  "elk.spacing.edgeEdge": "10", "elk.layered.spacing.edgeEdgeBetweenLayers": "10",
};
const SIDE = 176;  // how wide a stage's words are when they sit beside its cards
const SCREEN = [1600, 1000];  // the screen a layout is judged for, so a page looks the same in every window
let routes = null, arranging = null;
function arrange() {
  return arranging ??= (async () => {
    await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = ELK_SRC; s.onload = ok; s.onerror = bad; document.head.append(s); });
    const elk = new ELK(), sections = [...stage.querySelectorAll(":scope > section")];
    const cards = sections.map(s => [...s.querySelectorAll(".node")].map(n => ({ id: n.dataset.node, width: n.offsetWidth, height: n.offsetHeight })));
    // Edges come into a stage from the side the graph runs from, so its words go on the other
    // side: above the cards when it runs right, to their left when it runs down.
    const words = down => sections.forEach(s => Object.assign($("header", s).style,
      down ? { position: "absolute", left: "16px", top: "16px", width: SIDE + "px" } : { position: "", left: "", top: "", width: "" }));
    const room = (s, down) => { const edge = 16 + s.clientTop, h = $("header", s).offsetHeight;
      return down ? { top: edge, left: edge + SIDE + 16, edge, least: h + 2 * edge } : { top: edge + h + 16, left: edge, edge, least: 0 }; };
    // The graph is built afresh for every call, because ELK writes its answer into the one it is
    // given. The written order is asked for at the root only: asked of a stage, elkjs 0.12 throws.
    const layout = (down, wrap, rooms) => elk.layout({
      id: "root",
      layoutOptions: {
        ...LAYERED, "elk.direction": down ? "DOWN" : "RIGHT", "elk.hierarchyHandling": "INCLUDE_CHILDREN",
        "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES", "elk.json.edgeCoords": "ROOT",
        "elk.padding": "[top=40,left=40,bottom=40,right=40]",
        ...(wrap ? { "elk.layered.wrapping.strategy": "MULTI_EDGE", "elk.aspectRatio": String(SCREEN[0] / SCREEN[1]) } : {}),
      },
      children: sections.map((s, i) => ({
        id: "stage:" + i, children: cards[i].map(c => ({ ...c, layoutOptions: { "elk.alignment": down ? "TOP" : "LEFT" } })),
        layoutOptions: {
          ...LAYERED, "elk.direction": down ? "DOWN" : "RIGHT",
          "elk.padding": `[top=${rooms[i].top},left=${rooms[i].left},bottom=${rooms[i].edge},right=${rooms[i].edge}]`,
          "elk.nodeSize.constraints": "MINIMUM_SIZE", "elk.nodeSize.minimum": `(0,${rooms[i].least})`,
        },
      })),
      edges: Object.values(NODES).flatMap(n => n.depends_on.map(dep => ({ id: dep + ">" + n.id, sources: [dep], targets: [n.id] }))),
    });
    const put = (g, down) => {
      words(down);
      Object.assign(stage.style, { display: "block", padding: 0, width: g.width + "px", height: g.height + "px" });
      g.children.forEach((c, i) => {
        const s = sections[i];
        Object.assign(s.style, { position: "absolute", left: c.x + "px", top: c.y + "px", width: c.width + "px", height: c.height + "px" });
        for (const row of s.querySelectorAll(":scope > div")) row.style.display = "contents";
        for (const k of c.children) Object.assign($("#node-" + CSS.escape(k.id)).style, { position: "absolute", left: k.x - s.clientLeft + "px", top: k.y - s.clientTop + "px" });
      });
      routes = g.edges.map(e => ({ from: e.sources[0], to: e.targets[0], d: e.sections.map(sec => rightAngles([sec.startPoint, ...(sec.bendPoints ?? []), sec.endPoint])).join(" ") }));
      extent = null;
    };
    const run = async (down, wrap) => {
      words(down);
      let rooms = sections.map(s => room(s, down)), g = await layout(down, wrap, rooms);
      put(g, down);
      const settled = sections.map(s => room(s, down));  // a stage that came out narrower or wider wraps its words differently
      if (settled.some((r, i) => r.top !== rooms[i].top)) { g = await layout(down, wrap, settled); put(g, down); }
      // How large it shows on a screen. A long chain shows larger folded into rows, at the price
      // of an edge that doubles back at each fold, so folding has to win by a clear margin.
      return { g, down, wrap, shown: Math.min(SCREEN[0] / g.width, SCREEN[1] / g.height) * (wrap ? 0.8 : 1) };
    };
    const best = [await run(false, false), await run(true, false), await run(false, true)].reduce((a, b) => b.shown > a.shown ? b : a);
    put(best.g, best.down);
  })().catch(e => console.warn("The graph could not be arranged, so its stages stay in rows joined by plain curves.", e));
}
function rightAngles(p, r = 8) {  // a path through the points, its corners rounded
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 1; i < p.length - 1; i++) {
    const a = p[i - 1], b = p[i], c = p[i + 1];
    const k = Math.min(r, Math.hypot(b.x - a.x, b.y - a.y) / 2), m = Math.min(r, Math.hypot(c.x - b.x, c.y - b.y) / 2);
    d += ` L${b.x - Math.sign(b.x - a.x) * k},${b.y - Math.sign(b.y - a.y) * k} Q${b.x},${b.y} ${b.x + Math.sign(c.x - b.x) * m},${b.y + Math.sign(c.y - b.y) * m}`;
  }
  return d + ` L${p.at(-1).x},${p.at(-1).y}`;
}
function curve(from, to) {
  const a = boxOf($("#node-" + CSS.escape(from))), b = boxOf($("#node-" + CSS.escape(to)));
  if (b.l >= a.r - 1) { const y1 = (a.t + a.b) / 2, y2 = (b.t + b.b) / 2, dx = Math.max(30, (b.l - a.r) / 2);
    return `M${a.r},${y1} C${a.r + dx},${y1} ${b.l - dx},${y2} ${b.l},${y2}`; }
  const x1 = (a.l + a.r) / 2, x2 = (b.l + b.r) / 2;
  return `M${x1},${a.b} C${x1},${a.b + 26} ${x2},${b.t - 26} ${x2},${b.t}`;
}

function drawEdges() {
  const svg = $("#edges");
  svg.setAttribute("width", stage.offsetWidth); svg.setAttribute("height", stage.offsetHeight);
  const lines = routes ?? Object.values(NODES).flatMap(n => n.depends_on.map(dep => ({ from: dep, to: n.id, d: curve(dep, n.id) })));
  svg.innerHTML = lines.map(e => {
    const idle = NODES[e.from].not_needed || NODES[e.to].not_needed;
    return `<path data-from="${esc(e.from)}" data-to="${esc(e.to)}" class="${idle ? "fill-none stroke-zinc-300 [stroke-dasharray:3_4] dark:stroke-zinc-700" : "fill-none stroke-zinc-400 dark:stroke-zinc-600"}" stroke-width="1" d="${e.d}"/>`;
  }).join("");
  trace();
}

// The edges of the card under the pointer, or else of the open one, are drawn over the rest.
let picked = null, pointed = null;
function trace() {
  const id = pointed ?? picked, svg = $("#edges");
  for (const p of [...svg.children]) {
    const on = id && (p.dataset.from === id || p.dataset.to === id);
    p.style.stroke = on ? "currentColor" : ""; p.style.strokeWidth = on ? 1.5 : "";
    if (on) svg.append(p);
  }
}
stage.addEventListener("pointerover", e => { const id = e.target.closest(".node")?.dataset.node ?? null; if (id !== pointed) { pointed = id; trace(); } });
stage.addEventListener("pointerleave", () => { pointed = null; trace(); });

function openNode(id) {
  const n = NODES[id]; if (!n) return;
  document.querySelectorAll(".node").forEach(e => e.classList.remove("ring-1", "ring-zinc-900", "dark:ring-zinc-100"));
  $("#node-" + CSS.escape(id))?.classList.add("ring-1", "ring-zinc-900", "dark:ring-zinc-100");
  picked = id; trace();
  const facts = [["Model", esc(n.model)], ["Time", esc(n.time)], ["Cost", esc(n.cost)], ["Tries", esc(n.tries)]].filter(([, v]) => v);
  let h = `<p class="text-sm text-zinc-500">${esc(n.kind)}${n.not_needed ? ", planned but not needed" : ""}</p>
    <h4 class="mt-1 text-lg font-semibold">${esc(n.title)}</h4>
    <p class="mt-1 text-sm text-zinc-500">${esc(n.description)}</p>`;
  if (!n.not_needed) h += `<dl class="mt-5 grid grid-cols-[auto_1fr] gap-x-5 gap-y-1.5 text-sm">${facts.map(([k, v]) => `<dt class="text-zinc-500">${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  else h += `<p class="mt-5 text-sm">${esc(n.not_needed)}.</p>`;
  if (n.verdict) {
    const v = n.verdict;
    h += `<h5 class="${H5}">${v.accepted ? "The reviewer accepted it" : "The reviewer refused it"}</h5>
      <ul class="divide-y divide-zinc-200 text-sm dark:divide-zinc-800">${v.criteria.map(c =>
      `<li class="py-2.5"><span class="${c.passed ? "text-emerald-700 dark:text-emerald-400" : "text-red-600 dark:text-red-400"}">${c.passed ? "✓" : "✗"}</span> ${esc(human(c.name))}
       <p class="mt-1 text-zinc-600 dark:text-zinc-400">${esc(c.evidence)}</p></li>`).join("")}</ul>`;
    if (v.issues.length) h += `<h5 class="${H5}">Issues</h5><ul class="list-disc pl-5 text-sm">${v.issues.map(i => `<li>${esc(typeof i === "string" ? i : JSON.stringify(i))}</li>`).join("")}</ul>`;
  }
  if (n.checks.length) h += `<h5 class="${H5}">Checks it ran</h5><ul class="space-y-1 text-sm">${n.checks.map(c =>
    `<li><span class="${c.passed ? "text-emerald-700 dark:text-emerald-400" : "text-red-600 dark:text-red-400"}">${c.passed ? "✓" : "✗"}</span> ${esc(human(c.name))}</li>`).join("")}</ul>`;
  if (n.prompt) h += `<h5 class="${H5}">Prompt</h5><details class="text-sm text-zinc-600 dark:text-zinc-400"><summary class="cursor-pointer select-none text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100">Show the prompt it sent</summary><p class="mt-2 whitespace-pre-line">${esc(n.prompt)}</p></details>`;
  if (n.pictures.length) h += `<h5 class="${H5}">${n.kind === "Reviewer" ? "What it looked at" : "Pictures"}</h5><div class="grid grid-cols-2 gap-2">${n.pictures.map(p =>
    `<img class="w-full rounded-sm ${p.width > p.height * 1.6 ? "col-span-2" : ""}" style="${p.alpha ? CHECKER : ""}" src="${esc(p.src)}" alt="">`).join("")}</div>`;
  if (n.rationale) h += `<h5 class="${H5}">Its notes</h5><p class="text-sm text-zinc-600 dark:text-zinc-400">${esc(n.rationale)}</p>`;
  if (n.open_issues.length) h += `<h5 class="${H5}">What it flagged for later stages</h5><ul class="list-disc space-y-1 pl-5 text-sm text-zinc-600 dark:text-zinc-400">${n.open_issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  $("#dbody").innerHTML = h;
  $("#drawer").classList.replace("translate-x-full", "translate-x-0");
}
$("#dx").onclick = () => { $("#drawer").classList.replace("translate-x-0", "translate-x-full"); picked = null; trace(); };
document.querySelectorAll(".node").forEach(el => el.addEventListener("click", () => { openNode(el.dataset.node); reveal(el); }));
document.querySelectorAll("button.jump").forEach(el => el.addEventListener("click", () => {
  setView("graph"); history.replaceState(null, "", "#graph/" + el.dataset.node); openNode(el.dataset.node);
  arrange().then(() => centreOn($("#node-" + CSS.escape(el.dataset.node))));
}));

// The graph's camera. The stage is moved and scaled as one layer; nothing inside it is laid out again.
const cam = { x: 0, y: 0, z: 1 }, ZOOM = [0.2, 2.5], GRID = 24;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const clearWidth = () => vp.clientWidth - ($("#drawer").classList.contains("translate-x-0") ? $("#drawer").offsetWidth : 0);
let extent = null;  // measured once, the first time the graph is on screen
function bounds() {
  if (extent) return extent;
  const boxes = [...stage.querySelectorAll(":scope > section")].map(boxOf);
  return extent = { l: Math.min(...boxes.map(b => b.l)), t: Math.min(...boxes.map(b => b.t)), r: Math.max(...boxes.map(b => b.r)), b: Math.max(...boxes.map(b => b.b)) };
}
let settle = 0;
function place(glide = false) {
  const b = bounds(), keep = 120;  // some of the graph always stays in view
  cam.x = clamp(cam.x, keep - b.r * cam.z, vp.clientWidth - keep - b.l * cam.z);
  cam.y = clamp(cam.y, keep - b.b * cam.z, vp.clientHeight - keep - b.t * cam.z);
  let step = GRID * cam.z; while (step < 16) step *= 2;
  const ease = glide ? " .2s ease-out" : "";
  stage.style.transition = glide ? "transform" + ease : "none";
  vp.style.transition = glide ? `background-position${ease}, background-size${ease}` : "none";
  // Held as one layer while it moves, then let go so the text is redrawn sharp at the new size.
  stage.style.willChange = "transform";
  clearTimeout(settle); settle = setTimeout(() => { stage.style.willChange = "auto"; }, 260);
  stage.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  vp.style.backgroundSize = `${step}px ${step}px`;
  vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  $("#zpct").textContent = Math.round(cam.z * 100) + "%";
}
function zoomAt(x, y, z) {  // keeps the point under (x, y) in the viewport where it is
  z = clamp(z, ...ZOOM);
  cam.x = x - (x - cam.x) * z / cam.z; cam.y = y - (y - cam.y) * z / cam.z; cam.z = z;
}
function frame(glide = true, least = ZOOM[0], most = 1) {  // the whole graph, centred where it fits
  const b = bounds(), pad = 32, w = vp.clientWidth, h = vp.clientHeight;
  cam.z = clamp(Math.min((w - 2 * pad) / (b.r - b.l), (h - 2 * pad) / (b.b - b.t)), least, most);
  cam.x = (b.r - b.l) * cam.z > w - 2 * pad ? pad - b.l * cam.z : (w - (b.l + b.r) * cam.z) / 2;
  cam.y = (b.b - b.t) * cam.z > h - 2 * pad ? pad - b.t * cam.z : (h - (b.t + b.b) * cam.z) / 2;
  place(glide);
}
function centreOn(el) {
  const b = boxOf(el);
  cam.z = Math.max(cam.z, 1);
  cam.x = clearWidth() / 2 - (b.l + b.r) / 2 * cam.z; cam.y = vp.clientHeight / 2 - (b.t + b.b) / 2 * cam.z;
  place(true);
}
function reveal(el) {  // the least move that shows a node clear of the drawer
  const b = boxOf(el), pad = 24, w = clearWidth(), h = vp.clientHeight;
  const l = b.l * cam.z + cam.x, r = b.r * cam.z + cam.x, t = b.t * cam.z + cam.y, bottom = b.b * cam.z + cam.y;
  const dx = l < pad ? pad - l : r > w - pad ? Math.max(w - pad - r, pad - l) : 0;
  const dy = t < pad ? pad - t : bottom > h - pad ? Math.max(h - pad - bottom, pad - t) : 0;
  if (dx || dy) { cam.x += dx; cam.y += dy; place(true); }
}
const zoomBy = k => { zoomAt(clearWidth() / 2, vp.clientHeight / 2, cam.z * k); place(true); };
$("#zin").onclick = () => zoomBy(1.25); $("#zout").onclick = () => zoomBy(0.8);
$("#zfit").onclick = () => frame();
stage.addEventListener("focusin", e => { const n = e.target.closest(".node"); if (n?.matches(":focus-visible")) reveal(n); });

// Trackpad and wheel. Two fingers pan; a pinch arrives as a wheel with ctrlKey and zooms about the
// pointer, as does a wheel with the command key held. Taking the event here is also what stops the
// browser zooming the page or swiping back through history while the graph is up.
addEventListener("wheel", e => {
  if (!graphShown()) return;
  if (e.target.closest("#drawer") && !e.ctrlKey && Math.abs(e.deltaY) > Math.abs(e.deltaX)) return;  // the drawer scrolls itself
  e.preventDefault();
  if (!vp.contains(e.target)) return;
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vp.clientHeight : 1, at = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - at.left, e.clientY - at.top, cam.z * Math.exp(-clamp(e.deltaY * unit, -24, 24) * 0.012));
  else { cam.x -= e.deltaX * unit; cam.y -= e.deltaY * unit; }
  place();
}, { passive: false });

// Safari reports a trackpad pinch as gesture events instead.
let pinchFrom = 1;
for (const type of ["gesturestart", "gesturechange", "gestureend"]) addEventListener(type, e => {
  if (!graphShown()) return;
  e.preventDefault();
  if (type === "gesturestart") pinchFrom = cam.z;
  if (type !== "gesturechange" || touches.size > 1 || !vp.contains(e.target)) return;
  const at = vp.getBoundingClientRect();
  zoomAt(e.clientX - at.left, e.clientY - at.top, pinchFrom * e.scale);
  place();
}, { passive: false });

// Mouse and touch. One pointer drags the canvas, from a node as well as from empty space; two
// pinch. A press that did not travel is still a click on the node under it.
const touches = new Map(); let dragging = false, travelled = 0;
const hold = () => {
  const p = [...touches.values()];
  return { x: p.reduce((s, q) => s + q[0], 0) / p.length, y: p.reduce((s, q) => s + q[1], 0) / p.length,
           d: p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0 };
};
vp.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (!touches.size) { dragging = false; travelled = 0; }
  touches.set(e.pointerId, [e.clientX, e.clientY]);
});
vp.addEventListener("pointermove", e => {
  if (!touches.has(e.pointerId)) return;
  if (e.pointerType === "mouse" && !e.buttons) { release(e); return; }
  const a = hold(); touches.set(e.pointerId, [e.clientX, e.clientY]); const b = hold();
  travelled += Math.hypot(b.x - a.x, b.y - a.y);
  if (!dragging) {
    if (touches.size < 2 && travelled < 4) return;
    dragging = true; vp.setPointerCapture(e.pointerId); vp.classList.replace("cursor-grab", "cursor-grabbing");
  }
  cam.x += b.x - a.x; cam.y += b.y - a.y;
  if (a.d && b.d) { const at = vp.getBoundingClientRect(); zoomAt(b.x - at.left, b.y - at.top, cam.z * b.d / a.d); }
  place();
});
function release(e) {
  touches.delete(e.pointerId);
  if (touches.size) return;
  vp.classList.replace("cursor-grabbing", "cursor-grab");
  setTimeout(() => { dragging = false; });  // after the click this release may still produce
}
vp.addEventListener("pointerup", release); vp.addEventListener("pointercancel", release);
vp.addEventListener("click", e => { if (dragging) { e.stopPropagation(); e.preventDefault(); } }, true);
vp.addEventListener("dragstart", e => e.preventDefault());  // a node's picture is not lifted out of the canvas
addEventListener("resize", () => graphShown() && place());

// Clip buttons: the pressed one is playing.
function clipRow(root, view) {
  for (const b of root.querySelectorAll("[data-clip]")) b.onclick = () => {
    root.querySelectorAll("[data-clip]").forEach(x => x.setAttribute("aria-pressed", x === b));
    view.animationName = b.dataset.clip;
    view.play();
  };
}

customElements.whenDefined("model-viewer").then(() => {
  const mv = $("#mv");
  if (mv) {
    mv.addEventListener("load", () => { mv.classList.remove("invisible"); mv.previousElementSibling.classList.add("invisible"); });
    clipRow($("#clips"), mv);
  }
  // <PartStage>: a part is hidden through its own material, so the skeleton and the clip carry on.
  for (const stage of document.querySelectorAll("[data-part-stage]")) {
    const view = $("model-viewer", stage), materials = JSON.parse(stage.dataset.partStage);
    clipRow(stage, view);
    for (const b of stage.querySelectorAll("[data-part]")) b.onclick = async () => {
      const shown = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", shown);
      if (!view.loaded) await new Promise(done => view.addEventListener("load", done, { once: true }));
      for (const name of materials[b.dataset.part]) {
        const m = view.model.getMaterialByName(name);
        await m.ensureLoaded();
        const [r, g, bl] = m.pbrMetallicRoughness.baseColorFactor;
        m.setAlphaMode(shown ? "OPAQUE" : "MASK");
        m.setAlphaCutoff(0.5);
        m.pbrMetallicRoughness.setBaseColorFactor([r, g, bl, shown ? 1 : 0]);
      }
    };
  }
});

function route() {
  const hash = location.hash.slice(1);
  if (!hash.startsWith("graph")) { setView("overview"); return; }
  setView("graph");
  const id = hash.split("/")[1];
  if (id && NODES[id]) { openNode(id); arrange().then(() => centreOn($("#node-" + CSS.escape(id)))); }
}
document.querySelectorAll("[data-tabs]").forEach(box => box.querySelectorAll("[data-tab]").forEach(tab => tab.addEventListener("click", () => {
  box.querySelectorAll("[data-tab]").forEach(t => t.setAttribute("aria-pressed", t === tab));
  box.querySelectorAll("[data-pane]").forEach(p => p.classList.toggle("hidden", p.dataset.pane !== tab.dataset.tab));
})));
document.querySelectorAll("[data-copy]").forEach(button => button.addEventListener("click", async () => {
  const label = button.querySelector("span"), before = label.textContent;
  try { await navigator.clipboard.writeText(button.dataset.copy); label.textContent = "Copied"; }
  catch { label.textContent = "Select and copy by hand"; }
  setTimeout(() => { label.textContent = before; }, 1500);
}));
document.querySelectorAll("[data-compare]").forEach(box => {

// Tile painter: the pipeline's neighbour rule (peering_mask), looked up in the atlas's own 47-mask
// table and drawn from its exact bytes. Past the frame it does what the game does at a map's edge:
// the side columns and the bottom row carry on, so the ground does not end in a finished rim there.
document.querySelectorAll("[data-painter]").forEach(box => {
  const cfg = JSON.parse(box.dataset.painter), canvas = box.querySelector("canvas"), ctx = canvas.getContext("2d");
  const W = cfg.start[0].length, H = cfg.start.length, C = cfg.atlases[0].cell, mark = box.querySelector("[data-highlight]");
  canvas.width = W * C; canvas.height = H * C;
  const sheets = cfg.atlases.map(() => null);
  let current = 0, grid, paint = null;
  const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
  const fit = rows => {  // centred across, sitting on the bottom row; cropped or padded to the grid
    const out = Array.from({ length: H }, () => Array(W).fill(0)), dx = Math.floor((W - rows[0].length) / 2), dy = H - rows.length;
    rows.forEach((row, y) => [...row].forEach((v, x) => { if (inside(x + dx, y + dy)) out[y + dy][x + dx] = v === "1" ? 1 : 0; }));
    return out;
  };
  const at = (x, y) => y < 0 ? 0 : grid[Math.min(y, H - 1)][Math.min(Math.max(x, 0), W - 1)];
  const mask = (x, y) => { const n = at(x, y - 1), e = at(x + 1, y), s = at(x, y + 1), w = at(x - 1, y);
    return [n & w & at(x - 1, y - 1), n, n & e & at(x + 1, y - 1), w, 1, e, s & w & at(x - 1, y + 1), s, s & e & at(x + 1, y + 1)].join(""); };
  const tile = (x, y) => inside(x, y) && grid[y][x] ? cfg.atlases[current].lookup[mask(x, y)] : null;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(113,113,122,0.18)"; ctx.lineWidth = 2;
    const sheet = sheets[current];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const t = tile(x, y);
      if (!t) ctx.strokeRect(x * C + 1, y * C + 1, C - 2, C - 2);
      else if (sheet) ctx.drawImage(sheet[t[0] + "," + t[1]], x * C, y * C);
    }
  }
  function load(i) {
    if (sheets[i]) return draw();
    const a = cfg.atlases[i], img = new Image();
    img.onload = () => {  // one canvas per tile, so scaling never samples a neighbouring tile
      const cells = {};
      for (let y = 0; y < a.rows; y++) for (let x = 0; x < a.columns; x++) {
        const c = document.createElement("canvas"); c.width = c.height = a.cell;
        c.getContext("2d").drawImage(img, x * a.cell, y * a.cell, a.cell, a.cell, 0, 0, a.cell, a.cell);
        cells[x + "," + y] = c;
      }
      sheets[i] = cells; if (i === current) draw();
    };
    img.src = a.src;
  }
  const cellAt = e => { const r = canvas.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)]; };
  function point(x, y) {
    const t = tile(x, y), a = cfg.atlases[current];
    mark.classList.toggle("hidden", !t);
    if (t) Object.assign(mark.style, { left: t[0] / a.columns * 100 + "%", top: t[1] / a.rows * 100 + "%", width: 100 / a.columns + "%", height: 100 / a.rows + "%" });
  }
  let last = null;
  const stroke = (x, y) => {  // every cell on the line from the last one, so a fast drag leaves no gaps
    const [x0, y0] = last || [x, y], steps = Math.max(Math.abs(x - x0), Math.abs(y - y0), 1);
    for (let i = 0; i <= steps; i++) {
      const cx = Math.round(x0 + (x - x0) * i / steps), cy = Math.round(y0 + (y - y0) * i / steps);
      if (inside(cx, cy)) grid[cy][cx] = paint;
    }
    last = [x, y]; draw();
  };
  canvas.addEventListener("pointerdown", e => {
    const [x, y] = cellAt(e); if (!inside(x, y)) return;
    paint = grid[y][x] ? 0 : 1; last = null; canvas.setPointerCapture(e.pointerId); stroke(x, y); point(x, y);
  });
  canvas.addEventListener("pointermove", e => {
    const [x, y] = cellAt(e);
    if (paint !== null && (!last || last[0] !== x || last[1] !== y)) stroke(x, y);
    point(x, y);
  });
  canvas.addEventListener("pointerup", () => { paint = null; });
  canvas.addEventListener("pointerleave", () => { if (paint === null) mark.classList.add("hidden"); });
  box.querySelectorAll("[data-shape]").forEach(b => b.addEventListener("click", () => { grid = fit(cfg.shapes[b.dataset.shape]); draw(); }));
  box.querySelectorAll("[data-atlas]").forEach(b => b.addEventListener("click", () => {
    current = +b.dataset.atlas;
    box.querySelectorAll("[data-atlas]").forEach(x => x.setAttribute("aria-pressed", x === b));
    box.querySelector("[data-sheet]").src = cfg.atlases[current].src; mark.classList.add("hidden"); load(current);
  }));
  grid = fit(cfg.start); load(0);
});

document.querySelectorAll("[data-ui-kit]").forEach(kit => {
  kit.querySelectorAll("button[data-n]").forEach(b => {
    for (const k of "nhpd") {
      const url = new URL(b.dataset[k], location);
      b.style.setProperty(`--${k}`, `url("${url}")`);
      new Image().src = url;  // load every state up front, so the first hover does not flash empty
    }
  });
  kit.querySelectorAll("[data-grip]").forEach(grip => {
    const box = grip.previousElementSibling; let start = null;
    grip.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY, w: box.offsetWidth, h: box.offsetHeight }; grip.setPointerCapture(e.pointerId); e.preventDefault(); });
    grip.addEventListener("pointermove", e => {
      if (!start) return;
      box.style.width = Math.max(parseFloat(box.style.minWidth), start.w + e.clientX - start.x) + "px";
      box.style.height = Math.max(parseFloat(box.style.minHeight), start.h + e.clientY - start.y) + "px";
    });
    grip.addEventListener("pointerup", () => { start = null; });
  });
  const caption = kit.nextElementSibling.querySelector("[data-kit-caption]"), idle = caption.textContent;
  kit.querySelectorAll("[data-glyph]").forEach(b => {
    b.addEventListener("mouseenter", () => { caption.textContent = `${b.dataset.glyph}: ${b.dataset.words}.`; });
    b.addEventListener("mouseleave", () => { caption.textContent = idle; });
  });
});

// Face rig: each eye and the mouth is its own patch; show the one patch per feature that matches its state.
document.querySelectorAll("[data-face-rig]").forEach(box => {
  const cfg = JSON.parse(box.dataset.faceRig);
  const now = Object.fromEntries(cfg.features.map(f => [f.id, "rest"]));
  const ids = group => cfg.features.filter(f => f.group === group).map(f => f.id);
  const eyes = ids("eyes"), mouth = ids("mouth");
  const show = () => {
    box.querySelectorAll("[data-patch]").forEach(img => img.classList.toggle("hidden", now[img.dataset.feature] !== img.dataset.state));
    box.querySelectorAll("[data-set]").forEach(b => b.setAttribute("aria-pressed", now[b.dataset.set] === b.dataset.state));
  };
  const set = (features, state) => { features.forEach(id => { now[id] = state; }); show(); };
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const stop = () => { timers.forEach(clearTimeout); timers = []; };
  // The run's own blink: the first stretch of its timeline where the eyes leave rest.
  const first = cfg.timeline.findIndex(s => s.eyes !== "rest"), blink = [];
  for (let i = first; i >= 0 && i < cfg.timeline.length && cfg.timeline[i].eyes !== "rest"; i++) blink.push([cfg.timeline[i].eyes, cfg.timeline[i].duration_ms]);
  const run = (features, steps) => { let t = 0; for (const [state, ms] of steps) { later(() => set(features, state), t); t += ms; } later(() => set(features, "rest"), t); };
  box.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", () => { stop(); set([b.dataset.set], b.dataset.state); }));
  box.querySelector('[data-action="blink"]').addEventListener("click", () => run(eyes, blink));
  box.querySelector('[data-action="wink"]').addEventListener("click", () => run(eyes.slice(-1), blink.map(([s, ms]) => [s, s.endsWith("closed") ? ms * 3 : ms])));
  box.querySelector('[data-action="timeline"]').addEventListener("click", () => {
    stop(); let t = 0;
    for (const s of cfg.timeline) { later(() => { set(eyes, s.eyes); set(mouth, s.mouth); }, t); t += s.duration_ms; }
    later(() => { set(eyes, "rest"); set(mouth, "rest"); }, t);
  });
  const mouthStates = cfg.features.find(f => f.group === "mouth")?.states ?? ["rest"];
  let blinking = null, talking = null;
  const blinkLoop = () => { run(eyes, blink); blinking = setTimeout(blinkLoop, 1800 + Math.random() * 2700); };
  const talkLoop = () => { set(mouth, mouthStates[Math.floor(Math.random() * mouthStates.length)]); talking = setTimeout(talkLoop, 120 + Math.random() * 120); };
  box.querySelector('[data-auto="blink"]').addEventListener("change", e => { clearTimeout(blinking); if (e.target.checked) blinkLoop(); });
  box.querySelector('[data-auto="talk"]').addEventListener("change", e => { clearTimeout(talking); if (e.target.checked) talkLoop(); else set(mouth, "rest"); });
  box.querySelector("[data-show-changes]").addEventListener("change", e => box.querySelector("[data-changes]").classList.toggle("hidden", !e.target.checked));
  show();
});

// Sprite stage: the delivered strips drawn the way the game draws them. Sizes are in units of
// character height; a strip's cell is scaled by the ruler and its size correction, and its bottom
// stands on the ground.
document.querySelectorAll("[data-sprite-stage]").forEach(box => {
  const cfg = JSON.parse(box.dataset.spriteStage);
  const motions = Object.fromEntries(cfg.states.map(s => [s.state, s]));
  cfg.states.forEach(s => { new Image().src = s.src; });
  const $ = sel => box.querySelector(sel);
  const stage = $("[data-stage]"), body = $("[data-body]"), shadow = $("[data-shadow]"), ladder = $("[data-ladder]"), rope = $("[data-rope]");
  const words = s => box.querySelector(`[data-play="${s}"]`)?.textContent ?? s;
  const WALK = 1.4, RUN = 3.2, JUMP = 4.2, FALL = 13, CLIMB = 0.9, RUNG = 0.2, EDGE = 0.6;
  const opt = { raw: false, box: false }, keys = new Set();
  const st = { state: "idle", t: 0, x: 3, y: 0, vy: 0, face: 1, travel: 0, demo: "idle", dir: 1, wait: 0 };
  let U = 1, W = 1, H = 1, ground = 1;
  const measure = () => { const r = stage.getBoundingClientRect(); H = r.height; U = H * 0.34; W = r.width / U; ground = H * 0.84; };
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const once = s => motions[s].mode === "once";
  const length = s => motions[s].frames.length / motions[s].fps;
  const climbing = () => st.state.startsWith("climb_");
  const top = () => { const m = motions[st.state]; return ground / U - m.cell[1] * m.rebase / cfg.per_unit - 0.1; };
  const set = (s, restart = false) => { if (restart || st.state !== s) { st.state = s; st.t = 0; describe(); } };
  const describe = () => {
    const m = motions[st.state], n = m.frames.length;
    const play = m.mode === "loop" ? `${n} frames at ${m.fps} fps, looping` : m.mode === "once" ? `${n} frames at ${m.fps} fps, played once`
      : m.mode === "hold" ? `holds one frame of the ${m.columns} drawn` : `${n} frames, stepped by the distance climbed, not by a clock`;
    const size = opt.raw ? (m.rebase === 1 ? "the size every other strip is matched to" : `shown as drawn; the correction would scale it ${m.rebase}×`)
      : st.state === cfg.baseline ? "the size every other strip is matched to" : `drawn at ${m.rebase}× to match ${words(cfg.baseline).toLowerCase()}`;
    $("[data-info]").textContent = `${words(st.state)}: ${play}; ${size}; ${m.mirror ? "mirrored when facing left" : "faces away, so it is never mirrored"}.`;
  };
  const press = s => box.querySelectorAll("[data-play]").forEach(b => b.setAttribute("aria-pressed", b.dataset.play === s));
  const fall = dt => {
    if (st.y <= 0 && st.vy <= 0) return false;
    st.vy -= FALL * dt; st.y += st.vy * dt;
    if (st.y > 0) return false;
    st.y = 0; st.vy = 0; return true;
  };
  const climbBy = dy => { const y = clamp(st.y + dy, 0.12, top()); st.travel += Math.abs(y - st.y); st.y = y; return y; };

  // A button plays one state on its own: walks cross the stage and turn, one-shots repeat after a pause.
  const demo = dt => {
    const d = st.demo;
    if (d === "walk" || d === "run") {
      st.x += st.face * (d === "run" ? RUN : WALK) * dt;
      if (st.x > W - EDGE || st.x < EDGE) { st.x = clamp(st.x, EDGE, W - EDGE); st.face *= -1; }
      set(d);
    } else if (d === "jump") {
      if (fall(dt)) st.wait = 0.6;
      if (st.y === 0 && (st.wait -= dt) <= 0) { st.vy = JUMP; st.y = 1e-4; set("jump", true); }
      else if (st.y === 0) set("idle");
    } else if (d.startsWith("climb_")) {
      set(d);
      if (st.wait > 0) st.wait -= dt;
      else { const y = climbBy(st.dir * CLIMB * dt); if (y >= top() || y <= 0.12) { st.dir *= -1; st.wait = 0.6; } }
    } else if (once(d)) {
      if (st.state !== d || st.t > length(d) + (d === "death" ? 1.4 : 0.7)) set(d, true);
    } else set(d);
  };
  // The keyboard drives it as a game would.
  const drive = dt => {
    if (climbing()) {
      const dy = ((keys.has("ArrowUp") ? 1 : 0) - (keys.has("ArrowDown") ? 1 : 0)) * CLIMB * dt;
      if (dy) climbBy(dy);
      return;
    }
    if (st.state === "death") return;
    const dir = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0), fast = keys.has("Shift");
    const busy = once(st.state) && st.state !== "jump" && st.t < length(st.state);
    if (dir && (!busy || st.y > 0)) { st.face = dir; st.x = clamp(st.x + dir * (fast ? RUN : WALK) * dt, EDGE, W - EDGE); }
    fall(dt);
    if (!busy) set(st.y > 0 ? "jump" : keys.has("ArrowDown") ? "crouch" : dir ? (fast ? "run" : "walk") : "idle");
  };
  const frame = m => {
    const n = m.frames.length;
    if (m.mode === "hold") return m.frames[0];
    if (m.mode === "gameplay_driven") return m.frames[Math.floor(st.travel / RUNG) % n];
    const i = Math.floor(st.t * m.fps);
    return m.frames[m.mode === "loop" ? i % n : Math.min(i, n - 1)];
  };
  const draw = () => {
    const m = motions[st.state], k = U * (opt.raw ? 1 : m.rebase) / cfg.per_unit, w = m.cell[0] * k, h = m.cell[1] * k;
    Object.assign(body.style, {
      width: `${w}px`, height: `${h}px`, left: `${st.x * U - w / 2}px`, top: `${ground - st.y * U - h}px`,
      backgroundImage: `url("${m.src}")`, backgroundSize: `${m.columns * w}px ${h}px`, backgroundPosition: `${-frame(m) * w}px 0`,
      transform: m.mirror && st.face < 0 ? "scaleX(-1)" : "", outline: opt.box ? "1px dashed rgb(161 161 170)" : "",
    });
    const lift = clamp(st.y, 0, 1), sw = U * 0.42 * (1 - lift * 0.5), sh = U * 0.07;
    Object.assign(shadow.style, { width: `${sw}px`, height: `${sh}px`, left: `${st.x * U - sw / 2}px`, top: `${ground - sh / 2}px`,
      opacity: climbing() ? 0 : 0.18 * (1 - lift * 0.6) });
    ladder.classList.toggle("hidden", st.state !== "climb_ladder");
    rope.classList.toggle("hidden", st.state !== "climb_rope");
    Object.assign(ladder.style, { left: `${st.x * U - U * 0.26}px`, width: `${U * 0.52}px`, height: `${ground}px`,
      background: `repeating-linear-gradient(to top, transparent 0 ${RUNG * U - 3}px, rgb(161 161 170) ${RUNG * U - 3}px ${RUNG * U}px)` });
    Object.assign(rope.style, { left: `${st.x * U - 1.5}px`, height: `${ground}px` });
  };
  const step = dt => {
    st.t += dt;
    if (st.demo) demo(dt); else drive(dt);
    draw();
  };
  box.step = step;  // lets a test advance the stage by hand

  box.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => {
    const s = b.dataset.play;
    st.demo = s; st.wait = 0; st.dir = 1; st.vy = 0;
    if (s.startsWith("climb_")) { st.x = clamp(st.x, 1, W - 1); st.y = 0.12; } else st.y = 0;
    set(s, true); press(s);
  }));
  box.querySelectorAll("[data-opt]").forEach(input => input.addEventListener("change", () => { opt[input.dataset.opt] = input.checked; describe(); draw(); }));
  const KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Shift", "z", "x"];
  stage.addEventListener("keydown", e => {
    const k = e.key === " " ? "ArrowUp" : e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!KEYS.includes(k)) return;
    e.preventDefault();
    $("[data-hint]").classList.add("hidden");
    if (st.demo) { st.demo = null; press(null); if (!climbing()) { st.y = Math.max(st.y, 0); set("idle"); } }
    if (st.state === "death") set("idle");
    if (!keys.has(k)) {
      if (climbing() && (k === "ArrowLeft" || k === "ArrowRight")) { st.vy = 0; st.face = k === "ArrowLeft" ? -1 : 1; set("jump", true); }
      else if (!climbing() && k === "ArrowUp" && st.y === 0) { st.vy = JUMP; st.y = 1e-4; set("jump", true); }
      else if (!climbing() && k === "z") set("basic_attack", true);
      else if (!climbing() && k === "x") set("skill_cast", true);
    }
    keys.add(k);
  });
  stage.addEventListener("keyup", e => keys.delete(e.key === " " ? "ArrowUp" : e.key.length === 1 ? e.key.toLowerCase() : e.key));
  stage.addEventListener("blur", () => keys.clear());
  stage.addEventListener("pointerdown", () => stage.focus({ preventScroll: true }));
  new ResizeObserver(() => { measure(); st.x = clamp(st.x, EDGE, W - EDGE); draw(); }).observe(stage);
  measure(); st.x = W / 2; set("idle", true); press("idle"); draw();
  let last = performance.now();
  const loop = now => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

// Parallax layers placed and scrolled the way the game does, under the page's tuning. The hero loop
// and the stage share one tuning per map, so a change in the stage's table shows in both.
const parallaxTuning = {};
const tuneOf = (map, layer) => ((parallaxTuning[map.id] ??= {})[layer.id] ??= { dy: layer.dy, scale: layer.scale, parallax: layer.parallax });
const announce = (map, source) => document.dispatchEvent(new CustomEvent("parallax-tuning", { detail: { map: map.id, source } }));
const TUNINGS = { tuned: l => ({ dy: l.dy, scale: l.scale, parallax: l.parallax }), game: l => ({ dy: 0, scale: l.game_scale, parallax: l.parallax }) };
const LAYER_HOW = { seam_repaint: "Repainted through its wrap", none: "Looped as drawn", mirror_repeat: "Reflected; it is a plain gradient" };
const layerName = id => id.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
const layerTop = (layer, h, walk, VH) => {
  const o = layer.offset;
  if (layer.anchor === "canvas_cover") return 0;
  if (layer.anchor === "screen_top") return o * h;
  if (layer.anchor === "screen_center") return VH / 2 - h / 2 + o * h;
  return (layer.anchor === "screen_bottom" ? VH : walk) - (1 - o) * h;
};
const byDepth = (a, b) => (a.plane === "foreground") - (b.plane === "foreground") || a.order - b.order;
const parallaxBand = (world, map, layer, VW, VH) => {
  const make = image => {
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:0;width:${VW}px;background-repeat:repeat-x;background-image:url("${image}")`;
    world.appendChild(d);
    return d;
  };
  const picture = make(layer.src), marks = make(layer.marks);
  marks.style.display = "none";
  let w = layer.width;
  const band = {
    layer, picture, marks,
    place() {
      const t = tuneOf(map, layer), h = layer.height * t.scale;
      w = layer.width * t.scale;
      const top = layerTop(layer, h, map.walk_surface, VH) + t.dy;
      for (const d of [picture, marks]) Object.assign(d.style, { top: `${top}px`, height: `${h}px`, backgroundSize: `${w}px ${h}px` });
    },
    scroll(camera, speed) { picture.style.backgroundPositionX = marks.style.backgroundPositionX = `${-((camera * speed) % w)}px`; },
  };
  band.place();
  return band;
};

// One row per layer, shown or not, with its speed, height and size under the page's tuning.
// `changed(true)` means the tuning moved; `changed(false)` that only visibility did.
const layerTable = (map, tbody, hidden, changed) => {
  const cell = "border-b border-zinc-200 py-2 pr-4 dark:border-zinc-800";
  const field = "rounded-sm border border-zinc-300 px-1.5 py-0.5 tabular-nums dark:border-zinc-700 dark:bg-zinc-900";
  tbody.replaceChildren(...map.layers.slice().sort(byDepth).map(l => {
    const tr = document.createElement("tr"), t = tuneOf(map, l);
    const how = LAYER_HOW[l.how] + (l.cuts ? `, cut back in at ${l.cuts} places` : "");
    tr.dataset.layer = l.id;
    tr.innerHTML = `<td class="${cell}"><input data-show type="checkbox" checked class="accent-zinc-900"></td>`
      + `<td class="${cell} pr-6">${layerName(l.id)}<span class="text-zinc-400"> · ${l.plane === "foreground" ? "in front" : "behind"}</span></td>`
      + `<td class="${cell} whitespace-nowrap text-zinc-500"><input data-tune="parallax" type="number" step="0.02" min="0" max="3" value="${t.parallax}" class="${field} w-16">× the camera</td>`
      + `<td class="${cell} tabular-nums text-zinc-500">${l.period} px</td>`
      + `<td class="${cell} text-zinc-500">${how}</td>`
      + `<td class="${cell} whitespace-nowrap"><input data-tune="dy" type="number" step="2" min="-400" max="400" value="${t.dy}" class="${field} w-20"> px</td>`
      + `<td class="${cell} whitespace-nowrap"><input data-tune="scale" type="number" step="0.01" min="0.3" max="3" value="${t.scale}" class="${field} w-20">×</td>`;
    tr.querySelector("[data-show]").addEventListener("change", e => { e.target.checked ? hidden.delete(l.id) : hidden.add(l.id); changed(false); });
    tr.querySelectorAll("[data-tune]").forEach(input => input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      if (Number.isFinite(v)) { tuneOf(map, l)[input.dataset.tune] = v; changed(true); }
    }));
    return tr;
  }));
};
const syncTable = (map, tbody) => tbody.querySelectorAll("tr").forEach(tr => {
  const t = tuneOf(map, map.layers.find(l => l.id === tr.dataset.layer));
  for (const key of ["parallax", "dy", "scale"]) tr.querySelector(`[data-tune="${key}"]`).value = t[key];
});

document.querySelectorAll("[data-parallax-loop]").forEach(box => {
  const cfg = JSON.parse(box.dataset.parallaxLoop), [VW, VH] = cfg.view;
  const view = box.querySelector("[data-loop]"), world = box.querySelector("[data-world]");
  const SPEED = 110;  // camera pixels a second in the game's 1280x720 view
  let map = null, bands = [], camera = 0;
  const reference = box.closest(".grid")?.querySelector("[data-loop-reference]");
  const load = id => {
    map = cfg.maps.find(m => m.id === id);
    world.replaceChildren();
    bands = map.layers.slice().sort(byDepth).map(l => parallaxBand(world, map, l, VW, VH));
    box.querySelectorAll("[data-loop-map]").forEach(b => b.setAttribute("aria-pressed", b.dataset.loopMap === id));
    if (reference) {
      reference.querySelector("img").src = map.reference.src;
      reference.querySelector("p").textContent = map.reference.file;
    }
  };
  const draw = () => { world.style.transform = `scale(${view.clientWidth / VW})`; bands.forEach(b => b.scroll(camera, tuneOf(map, b.layer).parallax)); };
  box.step = dt => { camera += SPEED * dt; draw(); };  // lets a test advance the loop by hand
  box.querySelectorAll("[data-loop-map]").forEach(b => b.addEventListener("click", () => { load(b.dataset.loopMap); draw(); }));
  document.addEventListener("parallax-tuning", e => { if (map && e.detail.map === map.id) bands.forEach(b => b.place()); });
  load(cfg.maps[0].id);
  let last = performance.now();
  const loop = now => { box.step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

document.querySelectorAll("[data-parallax-stage]").forEach(box => {
  const cfg = JSON.parse(box.dataset.parallaxStage);
  const [VW, VH] = cfg.view, walker = cfg.walker;
  const WALK = 1.4 * walker.unit, RUN = 3.2 * walker.unit, JUMP = 5.2 * walker.unit, FALL = 13 * walker.unit, EDGE = 180;
  const $ = sel => box.querySelector(sel);
  const stage = $("[data-stage]"), world = $("[data-world]"), rows = $("[data-layers]");
  const opt = { auto: true, flat: false, marks: false }, keys = new Set(), hidden = new Set();
  const st = { x: 0, feet: 0, vy: 0, grounded: true, face: 1, state: "idle", t: 0, jump: false };
  const me = "stage-" + Math.random();
  let map = null, bands = [], ground = null, body = null;
  Object.values(walker.states).forEach(s => { new Image().src = s.src; });

  // The map's own grid is the level: a cell is solid where it says 1, and every top edge is a
  // one-way platform. Below the grid is floor.
  const solid = (x, y) => {
    const c = Math.floor(x / map.tile), r = Math.floor((y - map.ground.top) / map.tile);
    if (c < 0 || c >= map.grid[0].length || r < 0) return false;
    return r >= map.grid.length || map.grid[r][c] === "1";
  };
  const groundAt = x => {
    const c = Math.floor(x / map.tile);
    let r = map.grid.length;
    while (r > 0 && map.grid[r - 1][c] === "1") r -= 1;
    return map.ground.top + r * map.tile;
  };
  const tune = () => { bands.forEach(b => b.place()); announce(map, me); };
  const load = id => {
    map = cfg.maps.find(m => m.id === id);
    world.replaceChildren();
    const layers = map.layers.slice().sort(byDepth);
    bands = layers.filter(l => l.plane !== "foreground").map(l => parallaxBand(world, map, l, VW, VH));
    ground = document.createElement("div");
    ground.style.cssText = `position:absolute;left:0;top:${map.ground.top}px;width:${map.ground.width}px;height:${map.ground.height}px;`
      + `background-image:url("${map.ground.src}");background-size:100% 100%`;
    world.appendChild(ground);
    body = document.createElement("div");
    body.style.cssText = "position:absolute;background-repeat:no-repeat";
    world.appendChild(body);
    bands = bands.concat(layers.filter(l => l.plane === "foreground").map(l => parallaxBand(world, map, l, VW, VH)));
    hidden.clear();
    layerTable(map, rows, hidden, retuned => { if (retuned) tune(); draw(); });
    st.x = Math.min(map.width / 2, 1500); st.face = 1; st.feet = groundAt(st.x); st.vy = 0; st.grounded = true;
    box.querySelectorAll("[data-map]").forEach(b => b.setAttribute("aria-pressed", b.dataset.map === id));
    draw();
  };
  const setAll = pick => { map.layers.forEach(l => Object.assign(tuneOf(map, l), pick(l))); syncTable(map, rows); tune(); draw(); };
  const move = dt => {
    let dir = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0), fast = keys.has("Shift");
    if (opt.auto) {
      if (st.x > map.width - EDGE) st.face = -1; else if (st.x < EDGE) st.face = 1;
      dir = st.face; fast = false;
    }
    let blocked = false;
    if (dir) {
      st.face = dir;
      const nx = Math.min(Math.max(st.x + dir * (fast ? RUN : WALK) * dt, EDGE / 2), map.width - EDGE / 2);
      if (!solid(nx, st.feet - 1)) st.x = nx;
      else {
        // A step no higher than one tile is walked up; anything taller is a wall.
        let top = map.ground.top + Math.floor((st.feet - 1 - map.ground.top) / map.tile) * map.tile;
        while (solid(nx, top - 1) && st.feet - top < map.tile) top -= map.tile;
        if (st.grounded && st.feet - top <= map.tile && !solid(nx, top - 1)) { st.feet = top; st.x = nx; } else blocked = true;
      }
    }
    if ((st.jump || (opt.auto && blocked)) && st.grounded) { st.vy = JUMP; st.grounded = false; st.t = 0; }
    st.jump = false;
    if (st.grounded && !solid(st.x, st.feet + 1)) { st.grounded = false; st.vy = 0; st.t = 10; }
    if (!st.grounded) {
      st.vy -= FALL * dt;
      const next = st.feet - st.vy * dt;
      let landed = false;
      if (st.vy <= 0) {
        for (let y = map.ground.top + Math.ceil((st.feet - map.ground.top) / map.tile) * map.tile; y <= next; y += map.tile) {
          if (solid(st.x, y + 1) && !solid(st.x, y - 1)) { st.feet = y; st.vy = 0; st.grounded = landed = true; break; }
        }
      }
      if (!landed) st.feet = next;
    }
    const state = !st.grounded ? "jump" : dir ? (fast ? "run" : "walk") : "idle";
    if (state !== st.state) { st.state = state; if (state !== "jump") st.t = 0; }
  };
  const draw = () => {
    const s = stage.clientWidth / VW, camera = Math.min(Math.max(st.x - VW / 2, 0), map.width - VW);
    world.style.transform = `scale(${s})`;
    bands.forEach(b => {
      const off = hidden.has(b.layer.id);
      b.picture.style.display = off ? "none" : "";
      b.marks.style.display = off || !opt.marks ? "none" : "";
      b.scroll(camera, opt.flat ? 1 : tuneOf(map, b.layer).parallax);
    });
    ground.style.transform = `translateX(${-camera}px)`;
    const m = walker.states[st.state], k = walker.unit * m.rebase / walker.per_unit, w = m.cell[0] * k, h = m.cell[1] * k;
    const i = Math.floor(st.t * (m.fps || 1));
    const frame = m.frames[st.state === "jump" ? Math.min(i, m.frames.length - 1) : i % m.frames.length];
    Object.assign(body.style, {
      width: `${w}px`, height: `${h}px`, left: `${st.x - camera - w / 2}px`, top: `${st.feet - h}px`,
      backgroundImage: `url("${m.src}")`, backgroundSize: `${m.columns * w}px ${h}px`, backgroundPosition: `${-frame * w}px 0`,
      transform: m.mirror && st.face < 0 ? "scaleX(-1)" : "",
    });
  };
  const step = dt => { st.t += dt; move(dt); draw(); };
  box.step = step;  // lets a test advance the stage by hand

  box.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => load(b.dataset.map)));
  box.querySelectorAll("[data-opt]").forEach(input => input.addEventListener("change", () => { opt[input.dataset.opt] = input.checked; draw(); }));
  $('[data-placement="game"]').addEventListener("click", () => setAll(TUNINGS.game));
  document.addEventListener("parallax-tuning", e => {
    if (map && e.detail.map === map.id && e.detail.source !== me) { bands.forEach(b => b.place()); syncTable(map, rows); }
  });
  // While the stage has focus it owns the arrow keys and Space, so they move the character and never scroll the page.
  const OWNED = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Shift"];
  stage.addEventListener("keydown", e => {
    if (!OWNED.includes(e.key)) return;
    e.preventDefault();
    $("[data-hint]").classList.add("hidden");
    if (e.key !== "Shift" && opt.auto) { opt.auto = false; $('[data-opt="auto"]').checked = false; }
    if ((e.key === "ArrowUp" || e.key === " ") && !e.repeat) st.jump = true;
    keys.add(e.key);
  });
  stage.addEventListener("keyup", e => keys.delete(e.key));
  stage.addEventListener("blur", () => keys.clear());
  stage.addEventListener("pointerdown", () => stage.focus({ preventScroll: true }));
  new ResizeObserver(() => map && draw()).observe(stage);
  load(cfg.maps[0].id);
  let last = performance.now();
  const loop = now => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

document.querySelectorAll("[data-parallax-playground]").forEach(box => {
  const cfg = JSON.parse(box.dataset.parallaxPlayground), [VW, VH] = cfg.view;
  const $ = sel => box.querySelector(sel);
  const stage = $("[data-stage]"), world = $("[data-world]"), rows = $("[data-layers]"), speedInput = $("[data-speed]");
  const opt = { flat: false, marks: false, playing: true }, keys = new Set(), hidden = new Set(), me = "playground-" + Math.random();
  const KEY_SPEED = 480;  // camera pixels a second while an arrow key is held
  let map = null, bands = [], camera = 0, speed = parseFloat(speedInput.value), drag = null;
  const tune = () => { bands.forEach(b => b.place()); announce(map, me); };
  const load = id => {
    map = cfg.maps.find(m => m.id === id);
    world.replaceChildren();
    bands = map.layers.slice().sort(byDepth).map(l => parallaxBand(world, map, l, VW, VH));
    hidden.clear();
    layerTable(map, rows, hidden, retuned => { if (retuned) tune(); draw(); });
    box.querySelectorAll("[data-map]").forEach(b => b.setAttribute("aria-pressed", b.dataset.map === id));
    draw();
  };
  const setAll = pick => { map.layers.forEach(l => Object.assign(tuneOf(map, l), pick(l))); syncTable(map, rows); tune(); draw(); };
  const draw = () => {
    world.style.transform = `scale(${stage.clientWidth / VW})`;
    bands.forEach(b => {
      const off = hidden.has(b.layer.id);
      b.picture.style.display = off ? "none" : "";
      b.marks.style.display = off || !opt.marks ? "none" : "";
      b.scroll(camera, opt.flat ? 1 : tuneOf(map, b.layer).parallax);
    });
  };
  const step = dt => {
    const held = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
    if (held) camera += held * KEY_SPEED * dt;
    else if (opt.playing && !drag) camera += speed * dt;
    draw();
  };
  box.step = step;  // lets a test advance the view by hand
  const showSpeed = () => {
    $("[data-speed-value]").textContent = speed === 0 ? "still" : `${Math.abs(speed)} px/s ${speed < 0 ? "←" : "→"}`;
  };
  const setPlaying = on => {
    opt.playing = on;
    const b = $("[data-play]");
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "Pause" : "Play";
  };

  box.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => load(b.dataset.map)));
  box.querySelectorAll("[data-opt]").forEach(input => input.addEventListener("change", () => { opt[input.dataset.opt] = input.checked; draw(); }));
  $("[data-play]").addEventListener("click", () => setPlaying(!opt.playing));
  speedInput.addEventListener("input", () => { speed = parseFloat(speedInput.value); showSpeed(); });
  $('[data-placement="game"]').addEventListener("click", () => setAll(TUNINGS.game));
  document.addEventListener("parallax-tuning", e => {
    if (map && e.detail.map === map.id && e.detail.source !== me) { bands.forEach(b => b.place()); syncTable(map, rows); }
  });
  // Dragging the picture moves the camera with the hand; the layers slide at their own speeds under it.
  stage.addEventListener("pointerdown", e => {
    stage.focus({ preventScroll: true });
    $("[data-hint]").classList.add("hidden");
    drag = { x: e.clientX, camera };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => { if (drag) camera = drag.camera - (e.clientX - drag.x) * VW / stage.clientWidth; });
  const release = () => { drag = null; };
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);
  // While the view has focus it owns the arrow keys and Space, so they never scroll the page.
  stage.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) return;
    e.preventDefault();
    $("[data-hint]").classList.add("hidden");
    if (e.key === " " && !e.repeat) setPlaying(!opt.playing);
    keys.add(e.key);
  });
  stage.addEventListener("keyup", e => keys.delete(e.key));
  stage.addEventListener("blur", () => keys.clear());
  new ResizeObserver(() => map && draw()).observe(stage);
  showSpeed();
  load(cfg.maps[0].id);
  let last = performance.now();
  const loop = now => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
