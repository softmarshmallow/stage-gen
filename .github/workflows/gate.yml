name: gate

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun test
        working-directory: web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src tests scripts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: bun install --frozen-lockfile
        working-directory: web
      # The whole credential-free gate. It strips provider keys by construction,
      # so a runner with secrets configured still cannot spend.
      - run: uv run python scripts/check.py
