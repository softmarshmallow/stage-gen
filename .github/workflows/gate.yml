name: gate

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run python scripts/check.py

  optional-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [legacy, apps, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-groups --frozen
      - run: uv run --all-groups python scripts/check.py --scope ${{ matrix.scope }}

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: uv sync --frozen
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: uv run python scripts/check.py --scope viewer

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: uv run --all-groups ruff format --check .
      - run: uv run --all-groups ruff check .
      - run: uv run --all-groups mypy --strict src tests scripts godot/legacy/python/stage_gen_legacy godot/legacy/tools godot/templates/asset_consumer/prepare.py apps/concept_studio/src examples

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - name: Install Godot
        env:
          GODOT_VERSION: 4.7.2
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}"
          unzip -q "$archive"
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "GODOT=$HOME/.local/bin/godot" >> "$GITHUB_ENV"
      - run: uv run --all-groups python scripts/check.py --scope godot
