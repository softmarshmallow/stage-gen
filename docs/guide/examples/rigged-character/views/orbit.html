<!doctype html>
<!-- Orbit the exported model. Plain web; the model URL comes from the view context. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
<model-viewer id="model" camera-controls autoplay style="width:100%;height:480px"></model-viewer>
<script type="module">
  import { context } from "/_gnode/view.js";
  const { step } = await context();
  document.getElementById("model").src = step.outputs.model.url;
</script>
