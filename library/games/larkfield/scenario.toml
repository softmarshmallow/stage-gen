# The declarative half of one scenario: every name the script may refer to, and
# nothing a person writes as prose. Digests, rights, and generation briefs live
# here because those are package facts rather than narrative — and keeping them
# out of the script is what lets the script stay a plain text file with no schema
# noise in it.
#
# Admission checks the two halves against each other in both directions: a name
# the script uses and this file does not declare is refused, and so is a
# declaration the script never uses.

schema_version = 1
kind = "scenario-v1"
game_id = "larkfield"
scenario_id = "last_class"
display_name = "The Last Class of Summer"
revision = 2

# The script is a package member bound to exact bytes, the way an image reference
# is. Editing the prose changes this digest; `stage-gen scenario check` reports
# the correct value and `--write-digest` repairs it.
script = "scenarios/last_class.scenario"
script_sha256 = "7e9eb353afd3750b246f8d80e69500040a9f2b20ff82e0d054920026897e24e4"
entry = "arrival"

# ------------------------------------------------------------------- the cast
# An actor that declares expressions can be shown; one that declares none speaks
# but is never drawn — the protagonist convention, and the reason `you` needs no
# plates. Which profile draws each of these is the scene's binding, not this
# file's, so the same scenario could be staged by another consumer.

[[cast]]
actor_id = "nao"
display_name = "Nao"
expressions = ["neutral", "delighted", "flustered", "concerned"]

[[cast]]
actor_id = "haruki"
display_name = "Haruki"
expressions = ["neutral", "delighted", "flustered", "concerned"]

[[cast]]
actor_id = "sayaka"
display_name = "Ms Toda"
expressions = ["neutral", "delighted", "flustered", "concerned"]

[[cast]]
actor_id = "you"
display_name = "You"

# ----------------------------------------------------------------- the stages
# Each stage is one generated background. The brief is what the recipe sends; the
# scenario never names a file or a run.

[[stages]]
stage_id = "classroom_day"
brief = "An original empty classroom in late afternoon, warm low sun through open windows, rice fields beyond, chairs still down, no people"

[[stages]]
stage_id = "classroom_dusk"
brief = "The same empty classroom at blue hour, ceiling fluorescents on, the fields outside gone dark, no people"

[[stages]]
stage_id = "radio_room"
brief = "A small disused school broadcast room under a staircase, grey equipment panels and a dusty console, one warm desk lamp, no people"

# ------------------------------------------------------------------ the audio

# Three moods, and the script decides which one is playing. Each carries the
# soundtrack component's own generation intent rather than a second shape that
# means the same thing, so the shared prompt compiler gives all of them the same
# guarantees about performance, ending and originality.

[[tracks]]
track_id = "summer_room"
brief = "Sparse unhurried piano over a wash of cicadas, a little hollow, late afternoon heat with nowhere to be"

[tracks.generation]
intent = "generate"
instrumental = true
seamless_loop = true
target_duration_seconds = 75

[[tracks]]
track_id = "dusk_signal"
brief = "The same piano turned watchful, low sustained strings underneath and a faint repeating three-note figure, curious rather than frightening"

[tracks.generation]
intent = "generate"
instrumental = true
seamless_loop = true
target_duration_seconds = 75

[[tracks]]
track_id = "under_the_stairs"
brief = "Close and airless, muted electric piano over faint tape hiss and the hum of old equipment, small and secret"

[tracks.generation]
intent = "generate"
instrumental = true
seamless_loop = true
target_duration_seconds = 60

# ------------------------------------------------------------------ the flags
# Booleans, declared up front. Anything a condition reads must appear here, and
# something reachable must set it.

[[flags]]
flag_id = "stayed_quiet"

[[flags]]
flag_id = "asked_about_recorder"

[[flags]]
flag_id = "heard_the_signal"

[[flags]]
flag_id = "told_haruki"

[[flags]]
flag_id = "keys_borrowed"

# ---------------------------------------------------------------- the endings
# Named so completion can be tracked and so the proof can insist each one is
# reachable.

[[endings]]
outcome_id = "broadcast"
label = "You heard it on the antenna"

[[endings]]
outcome_id = "talked"
label = "Forty minutes of nothing"

[[endings]]
outcome_id = "listened"
label = "You listened"

[[endings]]
outcome_id = "locked_out"
label = "It's under everything else"
