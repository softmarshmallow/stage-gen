schema_version = 3
kind = "dialogue-scene-v3"
game_id = "larkfield"
display_name = "Larkfield"
revision = 2
scene_brief = "A student records an empty classroom after the last class of summer"
transparency_mode = "native"

# The art direction of record, as pixels rather than adjectives. Nothing in the
# graph paints this: it is published into the run as the style plate and every
# generated image is drawn against it, so its digest rides each image node's
# cache identity. Replacing the file is a new look and re-bills the scene.
#
# It fixes medium, palette and light for the whole scene. It is NOT an identity
# reference for the cast: the plate shows one person, and asserting its identity
# over three actors would pull all of them toward that one face. Only an actor
# that binds the plate as its own `reference_id` is held to the person in it.
style_reference_id = "cover"

# The narrative, as an authored scenario rather than a flat beat list. The scene
# binds its scenario document by digest, and that document binds its script the
# same way, so one recorded hash closes over every word the scene can say. A game
# may hold several scenarios; this names the one it plays. Admission proves the
# whole thing finishable offline, before any art is paid for.
[scenario]
schema_version = 1
kind = "scenario-binding-v1"
ref = "scenarios/last_class.toml"
source_sha256 = "71b6d7109b77a16eefcc81ed7185f8dcd641e1031c6d0106d356e901e0570a2a"

# Which package members draw each actor the scenario can show. The scenario says
# who exists and what they can wear on their face; this says whose profile and
# whose plate supply it.

[[cast]]
actor_id = "nao"
reference_id = "cover"

[cast.character_profile]
schema_version = 1
kind = "character-profile-binding-v1"
ref = "characters/nao.toml"
source_sha256 = "7c07c3ecf9f0cbdde264692fe8d88fae730e41059041b7a77e43a5f6e86c065b"

