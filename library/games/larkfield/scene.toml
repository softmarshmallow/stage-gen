schema_version = 2
kind = "dialogue-scene-v2"
game_id = "larkfield"
display_name = "Larkfield"
revision = 1
scene_brief = "A student records an empty classroom after the last class of summer"
transparency_mode = "native"

# The art direction of record, as pixels rather than adjectives. Nothing in the
# graph paints this: it is published into the run as the concept plate and every
# generated image is drawn against it, so its digest rides each image node's
# cache identity. Replacing the file is a new look and re-bills the scene.
identity_reference_id = "cover"

# The authored identity of record, bound to exact bytes. The scene document names
# every member it depends on by exact relative path; the resolver reads each one
# and refuses a digest that no longer matches, offline, before any spend.
[character_profile]
schema_version = 1
kind = "character-profile-binding-v1"
ref = "character.toml"
source_sha256 = "7c07c3ecf9f0cbdde264692fe8d88fae730e41059041b7a77e43a5f6e86c065b"

[[references]]
reference_id = "cover"
source = "references/cover.png"
source_sha256 = "228cf2c677da07f924c15696538bb738c82e1533f251fcacd37a0c7674fcf091"
rights_status = "unreviewed"
rights_basis = [
    "Original brand-neutral prompt composed from this scene document and its character profile.",
    "First-party AI-generated plate selected by the task owner from a six-candidate sheet on 2026-08-31.",
    "Drawn against concept-studio/gallery/the-sky-remembers/images/cover.webp as a style reference only, for medium, palette and light; no subject, composition, or wardrobe was copied from it.",
    "No independent semantic review of the exact committed bytes is recorded yet; see references/cover.provenance.json.",
]

[background]
description = "An original empty classroom at blue hour, warm ceiling lights, open windows onto summer rice fields, no people"

[presentation]
slot = "right"
framing_zoom = 70
source_framing_zoom = 70

# The narrative, as an authored scenario rather than a flat beat list. The scene
# binds scenario.toml by digest, and scenario.toml binds its script the same way,
# so this one recorded hash closes over every word the scene can say. Admission
# proves the whole thing finishable offline, before any art is paid for.
[scenario]
schema_version = 1
kind = "scenario-binding-v1"
ref = "scenario.toml"
source_sha256 = "566670941f45243de3fa93ee4369c58f24cc33fc80e766e978281b01ec8882b9"
