# The art direction of record, as pixels rather than adjectives. Nothing in the
# graph paints this: it is published into the run as the style plate and every
# generated image is drawn against it, so its digest rides each image node's
# cache identity. Replacing the file is a new look and re-bills the scene.
#
# It fixes medium, palette and light for the whole scene. It is NOT an identity
# reference for the cast: the plate shows one person, and asserting its identity
# over three actors would pull all of them toward that one face. Only an actor
# that binds the plate as its own `reference_id` is held to the person in it.
style_reference_id = "cover"

# The narratives, as authored scenarios rather than a flat beat list. The scene
# binds each scenario document by digest, and that document binds its script the
# same way, so one recorded hash per entry closes over every word the scene can
# say. Admission proves each one finishable offline, before any art is paid for.
#
# A list, because an episode is split into several scenarios so each one's proof
# stays under its state ceiling - and the scene then declares the union of their
# stages, cast and tracks and draws each backdrop, plate and track exactly once.
# One entry today; the sixth costs no art the first five already paid for.
[[scenarios]]
schema_version = 1
kind = "scenario-binding-v1"
ref = "scenarios/last_class.toml"
source_sha256 = "ab038ee4c94b2dac84e27e9daf0fb6bb7ee3b6f81d3d3e3c00cf470ae657157d"

# Which package members draw each actor the scenario can show. The scenario says
# who exists and what they can wear on their face; this says whose profile and
# whose plate supply it.

[[cast]]
actor_id = "nao"
