[[dialogue]]
id = "record-the-room"
speaker = "Nao"
text = "Everyone's gone home. I wanted to record the room before they lock the building."
expression_state = "neutral"

[[dialogue]]
id = "stay-quiet"
speaker = "You"
text = "Then I'll stay quiet. I'd like to hear what an empty room sounds like."
expression_state = "delighted"

[[dialogue]]
id = "desks-and-cicadas"
speaker = "Nao"
text = "It's just desks and cicadas. Don't make it sound clever."
expression_state = "flustered"
