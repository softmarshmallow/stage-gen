# The art direction of record, as pixels rather than adjectives. Nothing in the
# graph paints this: it is published into the run as the concept plate and every
# generated image is drawn against it, so its digest rides each image node's
# cache identity. Replacing the file is a new look and re-bills the scene.
identity_reference_id = "cover"

# The authored identity of record, bound to exact bytes. The scene document names
# every member it depends on by exact relative path; the resolver reads each one
# and refuses a digest that no longer matches, offline, before any spend.
[character_profile]
schema_version = 1
kind = "character-profile-binding-v1"
ref = "character.toml"
source_sha256 = "7c07c3ecf9f0cbdde264692fe8d88fae730e41059041b7a77e43a5f6e86c065b"

[[references]]
