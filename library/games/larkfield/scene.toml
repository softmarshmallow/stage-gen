rights_status = "unreviewed"
rights_basis = [
    "Original brand-neutral prompt composed from this scene document and its character profile.",
    "First-party AI-generated plate selected by the task owner from a six-candidate sheet on 2026-08-31.",
    "Drawn against concept-studio/gallery/the-sky-remembers/images/cover.webp as a style reference only, for medium, palette and light; no subject, composition, or wardrobe was copied from it.",
