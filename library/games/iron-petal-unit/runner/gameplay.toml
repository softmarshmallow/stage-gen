schema_version = 4
kind = "runner-gameplay-v4"
game_id = "iron-petal-unit"
revision = 7
track_id = "halcyon-rescue-line"

[run]
speed_profile = "swift_runner_v1"
jump_profile = "double_arc_v1"
collision_box = "torso_v1"
duck_profile = "slide_v1"

# A rescue run should survive a clipped valve; a fall down a coolant shaft or a
# closing press should not be survivable, because there is nothing left to
# recover onto that reads as the same run.
[run.consequences]
hazard = "drain_v1"
pit = "drain_and_recover_v1"
crush = "end_run_v1"
# A seed pod thrown by maintenance equipment is a knock, not a killing blow.
shot = "drain_v1"

[run.vitals]
profile = "three_point_v1"
hurt_representation = "blink_v1"

[ramp]
profile = "brisk_ramp_v1"

# The contract floor, which at the swift base speed is a little over twenty
# seconds of running before the pruner blocks the line. Iron Petal is the
# package the genre is demonstrated from, so it sits at the shortest interval
# admission allows: long enough that the authored track is still the run and
# the fight is still the interruption, short enough to be seen.
[encounter]
boss_id = "canopy_pruner"
profile = "barrage_boss_v1"
locomotion = "thrust_v1"
interval_columns = 200
arena_segment_id = "open_canopy_bay"
boss_projectile_id = "bramble_knot"
player_projectile_id = "seeding_pin"
