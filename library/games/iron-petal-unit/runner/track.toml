# The bay the runaway pruner is met in. Flat and empty in every column, so it
# may be entered anywhere, repeated for as long as the fight lasts, and left
# anywhere - which is what lets one authored chunk hold an encounter of any
# length without the seam rule bending. It carries no hazards and no seed line
# because during the fight the thing to read is the salvo.
[[segments.chunks]]
segment_id = "open_canopy_bay"
role = "arena"
difficulty = 1
occupancy = [
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "00000000000000000000000000000000",
  "11111111111111111111111111111111",
  "11111111111111111111111111111111",
  "11111111111111111111111111111111",
]
