schema_version = 3
kind = "runner-audio-v3"
game_id = "iron-petal-unit"
revision = 4

# What the soundtrack does at the run's edges. The death stinger is the effect
# bound to `death` below; the music fades out under it, and a fresh run starts
# the next shuffled track. A survivable hit ducks the music under its clank.
[music.death]
action = "stop"
fade_seconds = 1.2
curve = "exponential"

[music.restart]
action = "play"
fade_seconds = 0.5
curve = "linear"

[music.hurt]
duck_gain = 0.4
fade_seconds = 0.05
hold_seconds = 0.2
recovery_seconds = 0.8
curve = "linear"

[bindings]
takeoff = "servo_takeoff"
air_jump = "reactor_air_step"
land = "ceramic_landing"
slide = "rail_slide"
hazard_cleared = "rescue_clear"
collect = "seed_chime"
hurt = "hull_clank"
death = "unit_stalled"

[[effects]]
effect_id = "servo_takeoff"
display_name = "Servo Takeoff"

[effects.realization]
kind = "oscillator_sweep_v1"
waveform = "triangle"
start_frequency_hz = 260
end_frequency_hz = 620
duration_milliseconds = 130
gain = 0.15
strength_pitch_multiplier = 0.0

