schema_version = 4
kind = "runner-audio-v4"
game_id = "iron-petal-unit"
revision = 6

# What the soundtrack does at the run's edges. The death stinger is the effect
# bound to `death` below; the music fades out under it, and a fresh run starts
# the next shuffled track. A survivable hit ducks the music under its clank.
[music.death]
action = "stop"
fade_seconds = 1.2
curve = "exponential"

[music.restart]
action = "play"
fade_seconds = 0.5
curve = "linear"

[music.hurt]
duck_gain = 0.4
fade_seconds = 0.05
hold_seconds = 0.2
recovery_seconds = 0.8
curve = "linear"

# The run-start announcement rides the stage-start cut-in: Mira speaks on the
# frame the rip opens, once per boot. It is the one binding that may be silent.
[bindings]
stage_start = "mira_go"
takeoff = "servo_takeoff"
air_jump = "reactor_air_step"
land = "ceramic_landing"
slide = "rail_slide"
hazard_cleared = "rescue_clear"
collect = "seed_chime"
hurt = "hull_clank"
death = "unit_stalled"

