revision = 1
display_name = "Iron Petal Unit"

[universe]
source = "universe.md"

[style]
label = "bright orbital botanical rescue anime"
keywords = [
  "premium high-resolution original 2D game art",
  "clean controlled ink-like outer contours",
  "two-to-three-band cel shading with digital gouache depth",
  "compact rounded friendly industrial machinery",
  "cream coral navy mint brass graphite and leaf-green palette",
  "material-specific ceramic metal glass cable leaf and water texture",
  "clear lateral silhouettes and distinct parallax planes",
  "curved orbital greenhouse glazing and optimistic daylight",
  "compact rescue machinery readable against broad quiet environment shapes",
  "joyful urgent rescue-workshop mood",
]
avoid = [
  "franchise characters mascots costumes landmarks or trade dress",
  "logos signatures watermarks readable text or pseudo-text",
  "photorealism or 3D-rendered materials",
  "strict pixel-grid retro imitation",
  "full-frame paper grain canvas texture or sepia cast",
  "adult-looking teenage or sexualized pilot presentation",
  "infant anatomy or ambiguous baby presentation",
  "detached rider empty robot sealed canopy or duplicate actor",
  "firearms gore grim violence or military insignia",
  "busy scenery that hides the footing line hazards or pickup route",
]

[proportion]
heads_tall = 3.8

[proportion.by_body_kind]
# The entire robot-feet-to-rider-top silhouette is measured in Mira's visible
# head units. Rider and machine remain one runtime actor.
