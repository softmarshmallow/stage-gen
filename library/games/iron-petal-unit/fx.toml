[cut_in.frame]
mode = "generated_v1"
layout = "cut_in_frame_1536x1024_v1"
alpha_policy = "transparent_exterior_opaque_body_v1"
reference_ids = ["cover_style"]
prompt = "The cover's print-poster register: flat white paper stock, a bold uneven hand-inked black rim, the graphic weight of a notice pinned up in a greenhouse service bay."
shape = "One wide shard on a strong diagonal, running off both the left and the right edge of the canvas and thick enough along its whole length to carry a face. Its top and its bottom edge are long and clean, broken here and there by a sharp angular chip, so it reads as a sheet slashed open rather than fringed or frayed."

[sprite.dust]
layout = "fx_dust_atlas_1024x1024_v1"
alpha_policy = "transparent_exterior_v1"
reference_ids = ["cover_style"]
prompt = "Each cloud is a compact cartoon puff of a handful of big rounded lobes, flat cream-white, one warm-grey shading band underneath, and the same thick even graphite ink outline: the cover's own line weight, kicked up off a greenhouse service floor."

[[cut_in.portraits]]
portrait_id = "stage_start"
layout = "cut_in_portrait_1536x1024_v1"
alpha_policy = "transparent_exterior_v1"
reference_ids = ["operator_primary"]
prompt = "Mira at the instant the rescue line opens: wide blue-gray eyes locked on the viewer with fierce, determined excitement, freckles, the crooked confident grin, the coral-and-mint sprout barrette in her tousled dark-brown bob, a hint of the cream utility jacket collar."

[[moments]]
moment = "stage_start"
effect = "cut_in"
portrait_id = "stage_start"
choreography = "tear_reveal_v1"

# The moment announces what has arrived, so the plate is the pruner itself and
# not the operator meeting it: its identity is inherited from the concept plate
# this same run draws, which is the only way a generated actor can appear in a
# cut-in and be certain to be the one the player then fights. The references
# here carry the print register only.
[[cut_in.portraits]]
portrait_id = "encounter_start"
layout = "cut_in_portrait_1536x1024_v1"
alpha_policy = "transparent_exterior_v1"
reference_ids = ["cover_style"]
prompt = "The pruner the instant it drops into the line: its trimming head swung wide open toward the viewer, the status lens burning close and hard rather than idling, bramble and torn roots swinging with the weight of the move, the lift fans kicked to full and hazed with the leaf litter they are throwing."

