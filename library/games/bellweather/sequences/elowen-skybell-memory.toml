visible_subject_ids = ["wayfarer"]
focus_subject_id = "wayfarer"
listener_id = "elowen_thistledew"
expression = "determined"
text = "Then I will bring back the pages, but I will also watch what changes around them. Tiny signs deserve witnesses too."
advance_policy = "manual"
next_node_id = "elowen_gives_counsel"

[[nodes]]
node_id = "elowen_gives_counsel"
