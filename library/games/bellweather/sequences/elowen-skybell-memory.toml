visible_subject_ids = ["elowen_thistledew"]
focus_subject_id = "elowen_thistledew"
listener_id = "wayfarer"
expression = "neutral"
text = "Keep that instinct. When Crowncrag Road rearranges itself, trust the living details: bent grass, startled birds, and flowers facing light no map remembers."
advance_policy = "manual"
next_node_id = "wayfarer_thanks_elowen"

