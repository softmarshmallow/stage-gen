visible_subject_ids = ["wayfarer"]
focus_subject_id = "wayfarer"
listener_id = "elowen_thistledew"
expression = "curious"
text = "Can a page leave pollen? I thought the chronicle was ink and paper, not a garden."
advance_policy = "manual"
next_node_id = "elowen_explains_skybells"

[[nodes]]
node_id = "elowen_explains_skybells"
node_kind = "dialogue"
speaker_id = "elowen_thistledew"
visible_subject_ids = ["elowen_thistledew"]
focus_subject_id = "elowen_thistledew"
listener_id = "wayfarer"
expression = "thoughtful"
text = "Stories root wherever people repeat them. Skybells once grew along every remembered path in my childhood valley; when the valley was forgotten, the flowers vanished with it."
advance_policy = "manual"
next_node_id = "wayfarer_hears_the_loss"

[[nodes]]
node_id = "wayfarer_hears_the_loss"
node_kind = "dialogue"
speaker_id = "wayfarer"
visible_subject_ids = ["wayfarer"]
focus_subject_id = "wayfarer"
listener_id = "elowen_thistledew"
expression = "concerned"
text = "So recovering the pages might restore more than the road. It might return things people have stopped knowing how to miss."
advance_policy = "manual"
next_node_id = "elowen_shows_sprig"

[[nodes]]
node_id = "elowen_shows_sprig"
node_kind = "dialogue"
speaker_id = "elowen_thistledew"
visible_subject_ids = ["elowen_thistledew"]
focus_subject_id = "elowen_thistledew"
listener_id = "wayfarer"
expression = "delighted"
text = "Exactly. This one fresh sprig appeared at dawn beside the road marker. A small proof that memory can grow back before anyone is ready to believe it."
advance_policy = "manual"
next_node_id = "wayfarer_promises_to_notice"

[[nodes]]
node_id = "wayfarer_promises_to_notice"
node_kind = "dialogue"
