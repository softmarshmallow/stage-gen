schema_version = 3
kind = "game-map-v3"
game_id = "bellweather"
map_id = "crowncrag-road"
revision = 4
display_name = "Amberbell Forest"

[view]
profile = "side_view_2d"
gameplay_space = "side_plane"
camera_behavior = "scrolling"
scroll_axis = "x"

[continuity]
seamless_axis = "x"

[[references]]
reference_id = "amberbell_scene"
source = "references/amberbell-forest-scene.png"
source_sha256 = "0d65f9b8015e066e0f53fa8cf597b25b56fb811568141d1d0a2faf9edaa73589"
rights_status = "redistribution-approved"
rights_basis = [
  "AI-generated loop-aware Bellweather scene reference approved by the authenticated task owner.",
  "Digest-bound review in references/amberbell-forest-scene.visual-review.md.",
]

[[layers]]
layer_id = "open_sky"
reference_ids = ["amberbell_scene"]
plane = "background"
order = 0
parallax = 0.0
alpha_mode = "opaque"
prompt = """
Reconstruct only the uninterrupted saturated blue sky plate behind Amberbell
Forest. Preserve its calm high-key color variation and warm autumn light.
Remove clouds, mountains, castle, trees, shrines, water, route, characters,
creatures, and near decoration, then complete newly exposed sky naturally.
"""

[[layers]]
layer_id = "amberbell_horizon"
reference_ids = ["amberbell_scene"]
plane = "background"
order = 1
parallax = 0.14
alpha_mode = "transparent"
prompt = """
Separate the monumental cream clouds, lavender-blue mountains, soft autumn
valley, distant turquoise water, and many-spired Crowncrag Castle as one far
horizon layer. Preserve the castle as a small destination safely inside the
composition and retain the reference's compatible atmospheric rhythm at both
lateral boundaries. Exclude the ancient tree, shrines, route, characters,
creatures, and near decoration.
"""

[[layers]]
layer_id = "amberbell_route"
reference_ids = ["amberbell_scene"]
plane = "background"
order = 2
parallax = 0.62
alpha_mode = "transparent"
prompt = """
Separate Amberbell Forest's readable midground landmarks: one monumental
bell-hung tree, exposed roots, selective cream-stone shrines, layered autumn
canopy masses, mossy rocks, and the clear stream banks. Preserve the strict
side-view scale, broad quiet shapes, and centered landmark hierarchy. Exclude
sky, distant castle and mountains, route paving and terrain fill, close edge
foliage, characters, creatures, and interface elements.
"""

[[layers]]
layer_id = "autumn_foliage_frame"
reference_ids = ["amberbell_scene"]
plane = "foreground"
order = 0
parallax = 1.42
alpha_mode = "transparent"
prompt = """
Separate only restrained near stream-edge leaves, small roots, and a few mossy
stones along the bottom edge. Preserve sparse dark-teal, amber, and coral
accents without introducing a large edge anchor or uniform decoration. Exclude
the route, shrines, ancient tree, distant scenery, characters, and creatures.
"""

[ground]
mode = "tileset-12x4-v1"
reference_ids = ["amberbell_scene"]
prompt = """
Create Amberbell Forest's stable terrain material from the selected scene:
broad warm cream paving interwoven with old roots, moss-softened edges, sparse
amber leaf litter, rounded darker stones, and compact forest soil beneath.
Keep the footing line crisp and preserve broad quiet material areas rather
than dense repeated decoration.
"""
