schema_version = 3
kind = "game-map-v3"
game_id = "bellweather"
map_id = "sunpetal-crossing"
revision = 2
display_name = "Sunpetal Crossing"

[view]
profile = "side_view_2d"
gameplay_space = "side_plane"
camera_behavior = "scrolling"
scroll_axis = "x"

[continuity]
seamless_axis = "x"

[[references]]
reference_id = "sunpetal_scene"
source = "references/sunpetal-crossing-scene.png"
source_sha256 = "805989d74634f8e53ddec295cbb2e8aa82df651fb1022eec89d6aecfcc41a473"
rights_status = "redistribution-approved"
rights_basis = [
  "AI-generated Bellweather scene reference approved by the authenticated task owner.",
  "Digest-bound review in references/sunpetal-crossing-scene.visual-review.md.",
]

[[layers]]
layer_id = "clear_sky"
reference_ids = ["sunpetal_scene"]
plane = "background"
order = 0
parallax = 0.0
alpha_mode = "opaque"
prompt = """
Reconstruct only the uninterrupted high-key blue late-afternoon sky as a
strict lateral side-view plate. Preserve the clean digital finish and soft
cream cloud-light color variation, but remove every cloud mass, mountain,
island, castle, building, tree, character, creature, and foreground object.
Complete all exposed sky naturally and make the horizontal edges seamless.
"""

[[layers]]
layer_id = "clouds_and_far_valley"
reference_ids = ["sunpetal_scene"]
plane = "background"
order = 1
parallax = 0.16
alpha_mode = "transparent"
prompt = """
Separate and reinterpret the monumental cream clouds, lavender mountains,
distant floating bluffs, and ribbon waterfalls as one strict lateral
atmospheric background. Preserve the selected scene's palette, rounded
silhouettes, and progressively softer depth. Exclude the village, near route,
characters, creatures, and foreground vegetation.
"""

[[layers]]
layer_id = "sunpetal_village"
reference_ids = ["sunpetal_scene"]
plane = "background"
order = 2
parallax = 0.58
alpha_mode = "transparent"
prompt = """
Separate and reconstruct Sunpetal Crossing as a strict side-view village
strip: warm timber-and-stone cottages, flower boxes, a turning hill windmill,
market awnings, broad trees, lantern posts, low stone bridge, fences, and
decorative pennants without writing or symbols. Keep a clean open playfield
through the lower middle. Exclude sky, distant scenery, hero, creatures, and
close foreground plants.
"""

[[layers]]
layer_id = "near_garden_frame"
reference_ids = ["sunpetal_scene"]
plane = "foreground"
order = 0
parallax = 1.32
alpha_mode = "transparent"
prompt = """
Separate only the closest leaves, flowers, curved roots, and dark garden-edge
foliage that frame the bottom and sparse outer edges. Preserve coral, cream,
teal, and moss accents while keeping the center route unobstructed. Exclude
characters, creatures, buildings, bridge, sky, mountains, and distant trees.
"""

[ground]
mode = "tileset-12x4-v1"
reference_ids = ["sunpetal_scene"]
prompt = """
Create the stable Sunpetal Crossing ground material: warm cream stone path and
low bridge masonry, moss-softened edges, small grass tufts and flowers along
the surface, and darker soil or stone beneath. Match the clean digital
gouache-like finish and preserve a crisp readable footing line.
"""
