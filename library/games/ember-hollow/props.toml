schema_version = 1
kind = "oblique-survival-props-v1"
package_id = "ember-hollow"

motion_hint_allowed = ["sway_top", "bob", "flicker", "none"]
# What a blow does to the standing card, authored per prop and required:
#   shake  the card rocks about its foot away from the tool and settles, as a
#          trunk or a bush does
#   none   the card holds still; the chips, the dust and the camera kick still
#          happen. A boulder is rigid: nothing about it bends or gives.
# motion_hint is idle motion in the wind; this is the answer to a hit. They are
# authored apart because a dead trunk does not sway but does shudder.
hit_reaction_allowed = ["shake", "none"]

# height_units are multiples of the player's height. edge = "soft" turns on
# alpha-to-coverage in the viewer for foliage that a hard 0.5 cutoff chews up.
#
# How a prop's looks are drawn is a structural choice, and the only one the
# system knows about:
#   sprites  one image op per state; independent gates; the shared scale is
#            held by prompt alone (the default, when `sheet` is absent)
#   sheet    every state painted together into one lattice: one op, one
#            drawing scale by construction, half the pixels per look, and a
#            whole-sheet retry when one cell fails. `sheet = { columns, rows }`
#            with exactly one state per cell; 2x2, 3x2 or 2x3.
# Size is canonical and authored, never read off a drawing: height_units is
# the baseline look's height in player heights, and [props.look_height_units]
# sizes every other look that is not the baseline's size. A look listed there
# is calibrated from its own pixels against its own number; a look not listed
# rides the baseline's ruler (a cracked rock is rock-sized). The drawing's own
# opinion is kept in the manifest as drawn_height_meters, so a stump drawn
# waist-high is a recorded drift and a knee-high stump in the world.
# What a state MEANS is the author's, said in its brief and bound explicitly:
#   baseline_state         the look height_units measures and the anchor sits on
#   variants               looks the layout may place, weighted (a tree's age)
#   interaction.progress   the look after each hit before next_state (a rock
#                          being mined). "Age" and "mining" are words in this
#                          file and nowhere else.
# On a sheet, never ask for magenta or cyan on the object: the backing is
# keyed out by the one and the guides are found by the other.

# The winter look (seasons.toml `look = "winter"`) repaints every state as a
# paintover of its summer sprite under the season's shared clause; a prop may
# override that clause per state in [props.season_prompt.winter]. prop_prompt
# never reads it, so a winter brief moves no summer key.

[[props]]
prop_id = "pine"
family = "tree"
density_share = 1.0
height_units = 3.20
footprint_radius_units = 0.30
shadow_width_units = 0.95
edge = "hard"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 1
prompt = """
A tall narrow storm-bent conifer with a bare dark trunk, tiers of stiff drooping
needle fronds starting well above the ground, and a crooked leaning crown.
"""
# Four looks on one sheet. Three are what the layout may place -- the author
# calls them age, the system calls them variants -- and the fourth is what a
# chop leaves.
states = ["sapling", "grown", "old", "stump"]
baseline_state = "grown"
sheet = { columns = 2, rows = 2 }
look_height_units = { sapling = 1.3, old = 3.0, stump = 0.4 }

[props.state_prompt]
sapling = """
A young one a third the height of the grown tree: a thin straight trunk with
only two or three small tiers of fronds and a soft pointed top.
"""
grown = "Whole and standing at full height, the crown intact and leaning slightly."
old = """
The same tree at full height but ancient: the trunk thicker and more twisted,
the lowest tiers dead and bare, the crown sparser and bent harder to one side.
"""
stump = """
Only the freshly cut stump remains: a low ragged-topped trunk section, knee high
and no wider than the grown tree's trunk, with pale exposed heartwood on the cut
face and a few chips at its base.
"""

[props.variants]
states = ["sapling", "grown", "old"]
weights = [0.2, 0.6, 0.2]

[props.interaction]
verb = "chop"
hits = 3
next_state = "stump"
fx = "chips"
# An axe fells it in two blows; without one it cannot be felled at all.
tool = { item_id = "axe", hits = 2, required = true }
yields = [{ item_id = "log", count = 2 }]

[props.season_prompt.winter]
grown = "snow banked thick along the top of every tier of boughs, the green needles showing beneath each cap"
old = "snow banked thick along the top of every tier of boughs, the green needles showing beneath each cap"
sapling = "a small cap of snow on its top whorl"
stump = "a cap of snow on the cut top"

[[props]]
prop_id = "thorn_bush"
family = "bush"
density_share = 1.0
height_units = 0.55
footprint_radius_units = 0.26
shadow_width_units = 0.60
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 1
prompt = """
A low tangled thicket of thin arching thorned canes with small round dark leaves.
"""
states = ["full", "picked"]

[props.state_prompt]
full = "Heavy with clusters of small round dark berries hanging under the leaves."
picked = """
The same thicket stripped bare of fruit: no berries anywhere, a few empty stems
left where clusters hung. The cane structure and overall silhouette are unchanged.
"""

[props.interaction]
verb = "gather"
hits = 1
next_state = "picked"
fx = "leaves"
regrow_seconds = 45.0
yields = [{ item_id = "berry", count = 2 }]

[props.season_prompt.winter]
full = "bare of berries: no fruit anywhere, the same canes and leaves with snow caught along their tops"
picked = "snow caught along the tops of the canes"

[[props]]
prop_id = "moss_boulder"
family = "rock"
height_units = 0.75
footprint_radius_units = 0.42
shadow_width_units = 0.95
edge = "hard"
motion_hint = "none"
hit_reaction = "none"
max_components = 1
prompt = """
A blocky angular granite boulder with flat fractured faces, sharp broken edges,
and a cap of dark moss across its upper surfaces.
"""
# Four looks on one sheet: the whole rock, two looks it passes through as it is
# mined (the author's word; the system's is `progress`), and the rubble a spent
# rock leaves until it regrows.
states = ["whole", "cracked", "split", "rubble"]
baseline_state = "whole"
sheet = { columns = 2, rows = 2 }
look_height_units = { rubble = 0.3 }

[props.state_prompt]
whole = "Whole and uncut, every face intact."
cracked = """
The same boulder with one deep fresh crack running down its front face, a few
chips lying against its base. Same size and outline as the whole rock.
"""
split = """
The same boulder broken into two or three large blocks that have shifted apart
but still stand together, pale fresh stone showing on the broken faces. Same
overall size as the whole rock.
"""
rubble = """
Only a low heap of broken grey stone remains, about a third the height of the
whole rock, with the moss cap lying in pieces on top.
"""

[props.interaction]
verb = "mine"
hits = 3
progress = ["cracked", "split"]
next_state = "rubble"
fx = "chips"
regrow_seconds = 120.0
# Stone comes off the boulder only under a pick; loose stone lies on the
# ground (ground.toml [forage]) for the player who has none yet.
tool = { item_id = "pickaxe", hits = 3, required = true }
yields = [{ item_id = "stone", count = 2 }]

[props.season_prompt.winter]
whole = "a smooth rounded cap of snow over the top of the boulder, the moss and rock beneath as drawn"

[[props]]
prop_id = "grass_tuft"
family = "grass"
height_units = 0.30
footprint_radius_units = 0.0
shadow_width_units = 0.34
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 3
prompt = """
A small clump of tall dry grass: stiff thin blades fanning up and outward from a
single point, a few bent over at the tips.
"""
states = ["standing", "cut"]

[props.state_prompt]
standing = "Full height and upright."
cut = """
Cropped to short stubble: the same clump with the blades cut off low, leaving a
ragged tuft no taller than an ankle. Nothing else changes.
"""

[props.interaction]
verb = "gather"
hits = 1
next_state = "cut"
fx = "leaves"
regrow_seconds = 60.0
yields = [{ item_id = "grass_tuft", count = 1 }]

[props.season_prompt.winter]
standing = "the blades bent under a light load of snow, snow banked around the base"
cut = "the stubble half buried under snow"

[[props]]
prop_id = "campfire"
family = "campfire"
height_units = 0.35
footprint_radius_units = 0.30
shadow_width_units = 0.72
edge = "hard"
motion_hint = "none"
hit_reaction = "none"
# A firepit is honestly two things: the stone ring and the woodpile inside it.
max_components = 2
prompt = """
A small camp firepit: a ring of flat stacked stones around a low tepee of split
logs and kindling.
"""
states = ["unlit", "lit"]

[props.state_prompt]
unlit = "Cold and unlit, the wood grey and untouched, no flame and no glow."
lit = """
The wood charred and glowing at its base with hot orange embers between the logs,
but with no flame drawn above it: the flame is a separate animated element.
"""

[props.interaction]
verb = "light"
hits = 1
next_state = "lit"
fx = "sparkle"
yields = []

[props.season_prompt.winter]
unlit = "snow on the stones and on the cold wood"
lit = "snow on the stone ring only, melted back from the glowing wood in a dark wet ring"

[[props]]
prop_id = "canvas_tent"
family = "shelter"
height_units = 1.30
footprint_radius_units = 0.75
shadow_width_units = 1.70
edge = "hard"
motion_hint = "none"
hit_reaction = "none"
max_components = 1
prompt = """
A small patched canvas ridge tent stretched over a cut sapling frame, guy ropes
pegged out at the corners and the entry flap tied open.
"""
states = ["pitched"]

[props.state_prompt]
pitched = ""

# --- more vegetation -------------------------------------------------------------
#
# One conifer repeated across a whole wood reads as wallpaper, however good the
# card is. These three widen the silhouette vocabulary rather than the polygon
# count: a round broadleaf crown, a bare vertical snag, and a low horizontal
# spread. `density_share` splits the FAMILY's budget in `[world.density]`, so
# adding them mixes the wood instead of trebling it.

[props.season_prompt.winter]
pitched = "a smooth load of snow over the ridge and both slopes of the canvas, the door and the pegs clear"

[[props]]
prop_id = "birch"
family = "tree"
# Shorter and rounder than the pine on purpose: two conifers of the same height
# would read as one tree drawn twice.
height_units = 2.60
footprint_radius_units = 0.26
shadow_width_units = 1.05
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 1
density_share = 0.7
biome_weights = { forest_floor = 0.7, dry_meadow = 0.5, mossy_bog = 0.6, grey_scree = 0.1 }
prompt = """
A slender pale-barked broadleaf tree: a straight light trunk marked with short
dark scars, splitting high into a few bare limbs that carry a loose open crown
of small round leaves.
"""
# Every tree is chopable: the same four looks as the pine, on one sheet.
states = ["sapling", "grown", "old", "stump"]
baseline_state = "grown"
sheet = { columns = 2, rows = 2 }
look_height_units = { sapling = 1.0, old = 2.5, stump = 0.35 }

[props.state_prompt]
sapling = """
A young one, waist high to the grown tree: a single thin pale stem with a
handful of round leaves at the top and no limbs yet.
"""
grown = "Whole and standing, the crown open enough to see sky through."
old = """
The same tree grown thick and bowed: a leaning trunk with peeling bark, one
limb dead and bare, the crown thinner and lopsided.
"""
stump = """
Only the cut stump remains: a low pale-barked section, knee high and no wider
than the grown tree's trunk, with a clean cut face showing pale wood.
"""

[props.variants]
states = ["sapling", "grown", "old"]
weights = [0.2, 0.6, 0.2]

[props.interaction]
verb = "chop"
hits = 3
next_state = "stump"
fx = "chips"
# An axe fells it in two blows; without one it cannot be felled at all.
tool = { item_id = "axe", hits = 2, required = true }
yields = [{ item_id = "log", count = 2 }]

[props.season_prompt.winter]
grown = "snow along the tops of the pale branches and caught in the thin crown, the leaves beneath as drawn"
old = "snow along the tops of the pale branches and caught in the thin crown, the leaves beneath as drawn"

[[props]]
prop_id = "dead_snag"
family = "tree"
height_units = 2.10
footprint_radius_units = 0.24
shadow_width_units = 0.55
edge = "hard"
# A dead trunk does not sway.
motion_hint = "none"
hit_reaction = "shake"
max_components = 1
density_share = 0.35
# The bog is where trees die standing.
biome_weights = { forest_floor = 0.3, dry_meadow = 0.2, mossy_bog = 1.0, grey_scree = 0.35 }
prompt = """
A dead standing tree: a bare weathered grey trunk snapped off partway up, with
three or four stubs of broken branches and strips of loose bark hanging away
from the wood, in plain daylight on a fully transparent canvas with no dark
vignette, haze or glow behind it. No leaves and no needles anywhere.
"""
# Chopable too, and cheaper to fell: two blows, and the first snaps the top
# off (the author's word; the system's is `progress`).
states = ["standing", "leaning", "broken", "stump"]
baseline_state = "standing"
sheet = { columns = 2, rows = 2 }
look_height_units = { leaning = 2.0, broken = 1.2, stump = 0.35 }

[props.state_prompt]
standing = "Whole and upright, leaning very slightly."
leaning = "The same dead trunk leaning hard to one side, one root heaved out of the ground."
broken = """
The same trunk snapped off low, a little above head height, the top gone and
long splinters standing up from the break.
"""
stump = """
Only the cut stump remains: a low grey section, knee high and no wider than the
trunk, with a ragged cut face and a strip of bark hanging off it.
"""

[props.variants]
states = ["standing", "leaning"]
weights = [0.7, 0.3]

[props.interaction]
verb = "chop"
hits = 2
progress = ["broken"]
next_state = "stump"
fx = "chips"
tool = { item_id = "axe", hits = 2, required = true }
yields = [{ item_id = "log", count = 1 }]

[props.season_prompt.winter]
standing = "snow along every upper edge of the bare grey limbs and a cap on the broken top"
leaning = "snow along every upper edge of the bare grey limbs and a cap on the broken top"

[[props]]
prop_id = "fern_clump"
family = "bush"
height_units = 0.45
footprint_radius_units = 0.20
shadow_width_units = 0.70
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 1
density_share = 0.8
biome_weights = { forest_floor = 1.0, dry_meadow = 0.1, mossy_bog = 0.9, grey_scree = 0.0 }
prompt = """
A low spreading clump of arching ferns: each frond a narrow blade of small
paired leaflets, all splaying outward and slightly downward from one crown at
the ground.
"""
states = ["full"]

[props.state_prompt]
full = "Fresh and fully open, the outer fronds arching almost to the ground."

# --- the crafting world ------------------------------------------------------------
#
# Three props the crafting table leans on. The twig bush and the reed clump
# are the renewable sources of the two things every recipe starts from; the
# workbench is never scattered (no [world.density] row for its family), it
# exists only where the player builds it.

[props.season_prompt.winter]
full = "the fronds bowed under snow, their tips still green"

[[props]]
prop_id = "twig_bush"
family = "bush"
height_units = 0.70
footprint_radius_units = 0.22
shadow_width_units = 0.62
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 1
density_share = 0.7
biome_weights = { forest_floor = 0.9, dry_meadow = 0.8, mossy_bog = 0.4, grey_scree = 0.5 }
prompt = """
A leafless bush of many thin bare twigs rising from one root in a loose upright
fan, each twig forking once or twice near its tip, pale grey-brown wood.
"""
states = ["full", "cut"]

[props.state_prompt]
full = "Every twig whole, the fan standing at full height."
cut = """
The same bush cut back hard: every twig snapped off short a hand above the
root, a stubby fan of broken ends no taller than an ankle. Nothing else changes.
"""

[props.interaction]
verb = "gather"
hits = 1
next_state = "cut"
fx = "leaves"
regrow_seconds = 90.0
yields = [{ item_id = "twig", count = 2 }]

[[props]]
prop_id = "reed_clump"
family = "grass"
height_units = 0.90
footprint_radius_units = 0.0
shadow_width_units = 0.40
edge = "soft"
motion_hint = "sway_top"
hit_reaction = "shake"
max_components = 3
density_share = 0.5
# Reeds are the bog's grass; nowhere else.
biome_weights = { forest_floor = 0.0, dry_meadow = 0.05, mossy_bog = 1.0, grey_scree = 0.0 }
prompt = """
A tall narrow clump of marsh reeds: straight green stems rising close together
from one point, a few carrying a dark brown seed head at the top.
"""
states = ["standing", "cut"]

[props.state_prompt]
standing = "Full height and upright, the seed heads nodding a little."
cut = """
Cut down to short stubble: the same clump with the stems cut off low, leaving a
ragged tuft of green stubs no taller than an ankle. Nothing else changes.
"""

[props.interaction]
verb = "gather"
hits = 1
next_state = "cut"
fx = "leaves"
regrow_seconds = 75.0
yields = [{ item_id = "reed", count = 2 }]

[props.season_prompt.winter]
standing = "the reeds bent and half buried in a drift, snow banked around the base"
cut = "the cut stalks half buried under snow"

[[props]]
prop_id = "workbench"
family = "station"
height_units = 0.80
footprint_radius_units = 0.55
shadow_width_units = 1.30
edge = "hard"
motion_hint = "none"
hit_reaction = "none"
max_components = 2
prompt = """
A rough work bench: a split-log top on two thick stump legs, lashed with rope,
with a few flint chips and a bundle of twigs lying on the top.
"""
states = ["standing"]

[props.state_prompt]
standing = ""

[props.season_prompt.winter]
standing = "a flat load of snow on the bench top and along the edges of the tools"

