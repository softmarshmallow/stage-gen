# The screens around the game: the opening cinematic, the title screen, the
# loading screen. The shared `game-shell-v3` contract, whose rules live in
# docs/spec/game/shell.md and whose component is src/stage_gen/components/game_shell/.
#
# Nothing here asks for lettering, and the loader refuses a prompt that does.
# Every string on these screens — the game's name, a shot's card, a loading tip —
# is set by the host in the typeface below, never drawn into a plate. That is
# what keeps the name spelled correctly and translatable.

schema_version = 3
kind = "game-shell-v3"
game_id = "ember-hollow"
revision = 5

# The art direction of record, the same plate every other generated image in
# this package is drawn against. The shell is the first thing a player sees, so
# it is the last place that should be allowed to drift from the game's look.
[[references]]
reference_id = "style_plate"
source = "references/style-plate.png"
source_sha256 = "0f55649bf337ab3b057e88cf6854ca23a7142ebca57438f03bbd6cd74ee6ade0"
rights_status = "redistribution-approved"
rights_basis = ["Original AI-generated art direction plate approved for redistribution by the authenticated task owner."]

# Wren's authored appearance, the same picture the actor's concept node is drawn
# against. The opening has a protagonist in it, and prose cannot hold a character:
# it describes an outfit and the model invents the body. So the picture holds the
# design and the plate holds the drawing, exactly as actors.toml already does it.
[[references]]
reference_id = "player_appearance"
source = "references/player-appearance.png"
source_sha256 = "6bae2780aae3e8857e2e4eb95b9f930a0588108cc5ff535a77278b88b6eb76b0"
rights_status = "unreviewed"
rights_basis = ["Original AI-generated concept-studio candidate, used as a generation input and never published as art."]

# A placeholder, and knowingly the wrong face: Fredoka is a rounded storybook
# text face and this game is flat inked cutout survival. It is here because it
# is already in the repository under a licence that permits redistribution, so
# the pipeline could be proved without a download. Swapping it is one file, one
# digest and zero provider operations, because the wordmark is composited rather
# than drawn. See fonts/README.md.
[typeface]
family = "Fredoka"
source = "fonts/fredoka-variable.ttf"
source_sha256 = "2ba02e68b152868aef9ba28e24b3648c7d457fe6f25c761f2c2c53fb61a73fc8"
license = "OFL-1.1"
license_source = "fonts/OFL.txt"
copyright = "Copyright 2016 The Fredoka Project Authors"
upstream_source = "google/fonts, ofl/fredoka/Fredoka[wdth,wght].ttf"
retrieved = "2026-08-24"

# --- the opening -------------------------------------------------------------
#
# Three shots, twelve seconds, each a still the host moves over. The cards are
# the only prose a player reads before the world, so they say what the game is
# about — arriving somewhere cold with one warm thing in it — and nothing about
# rules, controls or story the game does not tell.

[opening]
layout = "opening_16x9_v1"
skippable = true
music_track = "main_theme"
# The last shot ends on a fire that has just been kept, and the title screen is a
# hollow at dusk with a fire in it. That is a claim about the picture rather than
# about presentation, so it would be measured -- and the two are not the same
# frame, so it is not claimed.
ending = "fade_to_black"

# Three filmed beats: the cold arrives, the light nearly goes, the fire is kept.
# Wordless on purpose -- the game's premise is already in the protagonist, a robot
# with a furnace in its chest, and a line of prose over it would be explaining what
# the picture is doing. Each beat is ten seconds, which is the longest single clip
# the bound route makes; the length above that comes from cutting them together,
# which is what a shot list already is.
#
# No `move` on any of them: a clip brings its own camera.
#
# All three are adopted rather than drawn. A ten-second clip is a dollar and the route
# takes no seed, so a run that draws these buys three dollars of lottery tickets every
# time the cache is cold, and gets three different films. The `take` on each shot is the
# draw that was watched and kept (from out/shell-clip-v2, 2026-09-07): it is copied into
# the run and admitted by the same gate the route's answer would have met, at no
# provider cost. The briefs stay because they are what was asked for and what a re-draw
# would use -- delete a shot's `take` line and that shot goes back to being filmed in
# the run, at a dollar.
#
# The takes themselves are not in git: they are megabytes of first-party video, so they
# sit beside the package and are bound here by sha256. A clone that does not carry them
# still loads, still plans and still prices the run; only the adopt node needs the bytes.

[[opening.shots]]
shot_id = "the_cold"
seconds = 10.0
out_transition = "cut"

[opening.shots.plate]
mode = "clip"
reference_ids = ["style_plate", "player_appearance"]
take = { path = "shell/the_cold.take.mp4", sha256 = "4baa0fde85a70be76429856b7fd4d2fd3a427dd7b1bf5a253a5cb6813e6a5534" }
prompt = """
Four shots, hard cuts between them, no dissolves.

Shot one, four seconds: an extreme wide from directly overhead, looking straight
down on an enormous empty snowfield, pale and almost abstract. The small salvaged
robot of the second reference image is a single tiny amber speck near the bottom,
walking away. The camera is locked off and does not move. Hold on the emptiness.

Cut. Shot two, two seconds: an extreme close-up of the small square window set in
the robot's chest, filling the frame. The fire behind the glass is low and
guttering. One ember falls dark.

Cut. Shot three, two seconds: a low angle from the snow itself, looking up past the
robot's legs at a sky going out, heavy snow falling toward the camera. The last
daylight drains away.

Cut. Shot four, two seconds: a near-black frame. Only the robot's two round amber
eyes and the faint square of its chest are visible, small and far off. They dim.
"""

[[opening.shots]]
shot_id = "the_dark"
seconds = 10.0
out_transition = "cut"

[opening.shots.plate]
mode = "clip"
reference_ids = ["style_plate", "player_appearance"]
take = { path = "shell/the_dark.take.mp4", sha256 = "51668873ed024a0632d0d84036c2708e5327955dcaf3952b245a45f293b41ef4" }
prompt = """
Six shots, hard cuts, no dissolves. The cuts come fast, about one a second, faster
than an ordinary scene.

Shot one, one second: a black frame. Two pale eyeless scavenger heads push into the
amber edge of the light from the left. Each is a low six-legged thing the size of a
big dog, a segmented grub body on spindly insect legs, a blunt eyeless head split by
a wide flat mandible, a ridge of stiff bristles down the back, pale underside and
dark plates on top. The mandibles open.

Cut. Shot two, one second: a very fast whip pan ending on an enormous close-up of
one wide flat mandible snapping shut, filling the frame.

Cut. Shot three, one second: low to the ground, six spindly legs crossing snow, close
and fast.

Cut. Shot four, one and a half seconds: the robot spins round toward the camera,
amber eyes wide, the light in its chest weak.

Cut. Shot five, two seconds: a high wide angle looking down as three of the
scavengers circle the robot in a slow ring, the amber pool of its light shrinking
under them.

Cut. Shot six, three and a half seconds: the robot backs into a ring of blackened
stones, raises its small hand axe, and holds. The camera pushes in fast on the
raised axe and stops hard.
"""

[[opening.shots]]
shot_id = "the_fire"
seconds = 10.0
out_transition = "dissolve"

[opening.shots.plate]
mode = "clip"
reference_ids = ["style_plate", "player_appearance"]
take = { path = "shell/the_fire.take.mp4", sha256 = "15b6803f0ce32d2700ff4ee2987729b572e7a352c1f35beaab6297bc79483648" }
prompt = """
Five shots, hard cuts, no dissolves.

Shot one, one second: the small hand axe in silhouette against a near-black frame,
at the top of its swing, beginning to fall.

Cut on the movement. Shot two, one second: the axe lands in a heap of kindling
inside the ring of blackened stones. Sparks burst outward.

Cut. Shot three, one and a half seconds: an extreme macro of one spark landing in
dry tinder and catching, a small flame unfolding, filling the frame.

Cut. Shot four, two and a half seconds: the fire flares hard and a wave of amber
light blasts outward across the snow. The frame blows out to near-white amber for an
instant. The scavengers recoil backward out of the light and are swallowed by the
dark.

Cut on the light. Shot five, four seconds: a slow wide pull back. The robot stands
beside a steady fire in the middle of the black hollow, snow still falling, the
window in its chest burning bright again, the one warm thing in the picture. The
camera stops and holds until the end.
"""

[title]
layout = "title_screen_16x9_v1"

[[title.backdrop]]
depth = "far"

[title.backdrop.plate]
mode = "still"
alpha_policy = "fully_opaque_v1"
reference_ids = ["style_plate"]
prompt = """
The hollow at blue dusk from a low rise looking down: a shallow bowl of snow ringed by
flat black conifer masses, with one small hard-edged amber glow of a fire tucked in low
and far over to one side, close to the frame's edge and well away from the centre. A wide
empty overcast sky fills the top of the frame in one flat pale tone with no cloud drawing
in it, and the snow through the centre and the bottom of the frame is one flat unbroken
field with nothing standing on it. Cold blues and bone against bark brown, the fire the
only warm accent.
"""

# No emblem in this revision, and the reason is worth keeping. A badge is the
# one thing on a title screen an image model ought to be good at, and this one
# cost more attempts than every other plate combined: first drawn as a campfire
# scene rather than a mark (the reviewer caught it), then refused by a gate that
# demanded one connected shape while the brief asked for a broken ring around
# separate flames, then still not settling once both were fixed. The title screen
# does not need it — the game's name is composited in the package's own face over
# a backdrop that measured 9.18 against a 12.0 ceiling — so the badge waits for a
# brief written from a drawn reference rather than from adjectives. `title.emblem`
# stays optional in `game-shell-v3` for exactly this case.

# --- the loading screen ------------------------------------------------------
#
# Zero provider operations: the backdrop is the winter season look this run
# already draws and publishes. A loading screen is the least-looked-at surface in
# the game and does not earn an image of its own.

[loading]
layout = "loading_screen_16x9_v1"
tips = [
  "A banked fire keeps until morning. An open one does not.",
  "Cold drains faster in the dark than it does in the snow.",
  "A tool wears out. Carry the makings of another.",
  "The hollow is wider than it looks. Mark your way back.",
]

[loading.backdrop]
source = "run_artifact"
artifact_role = "season_look_winter"
