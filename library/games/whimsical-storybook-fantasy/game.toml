schema_version = 3
kind = "game-contract-v3"
game_id = "whimsical-storybook-fantasy"
revision = 3
display_name = "Whimsical Storybook Fantasy"

# Which camera this game is authored for. A recipe that does not implement this projection
# refuses the binding instead of drawing side views for a top-down game.
[camera]
projection = "side_view_2d"

# The words that carry this game's look into every image prompt. Drawn from the closed
# vocabulary in src/stage_gen/resources/prompting/game_vocabulary_v1.json; anything else fails
# to load. At least one keyword must name the medium.
[style]
keywords = [
  "hand-painted gouache",
  "warm dusk palette",
  "soft diffuse light",
  "rounded friendly shapes",
  "visible brush texture",
  "gentle and welcoming mood",
]
avoid = [
  "photographic depth of field",
  "3D rendering",
  "cast ground shadows",
  "text and lettering",
]

# One build for the game. The player and every village resident resolve their height in heads
# from this table, which is what keeps a baker from rendering three times the player's height
# under a runtime that matches heads.
[proportion]
heads_tall = 2.0

[proportion.by_body_kind]
avian = 2.4

[cast.player]
body_kind = "human"

# Residents are stills that face the viewer. See ResidentDirection: an animated side-view
# townsperson was three quarters wasted artwork showing a person in profile ignoring the player
# standing in front of them.
[cast.resident]
body_kind_default = "human"
orientation = "front"
animation = "still"
allow_pose = true
allow_held_prop = true

# Floating combat text is a game-wide presentation mechanism. Version 3 materializes this
# policy as enabled when omitted; it is authored explicitly in the demo so agents can discover
# and disable it without knowing that defaulting rule.
[gameplay.combat_text]
schema_version = 1
kind = "combat-text-v1"
enabled = true

# Continuous hunting-ground population management. Each map contains independent spawn zones;
# a zone's weighted spawn table controls which ascending generated mob tiers may live there.
# Counts are maintained by the runtime's MobPopulationDirector, so defeating a mob opens exactly
# one vacancy and schedules exactly one replacement ticket after the authored respawn delay.
[gameplay.mob_population]
schema_version = 1
kind = "mob-population-v1"
update_interval_ms = 250
max_spawn_batch_per_update = 2

[[gameplay.mob_population.maps]]
map_id = "stage-1-approach"
seed_salt = 1103

[[gameplay.mob_population.maps.zones]]
zone_id = "approach-west"
surface = "terrain"
left_column = 10
right_column_exclusive = 90
initial_population = 3
target_population = 4
population_cap = 4
respawn_delay_ms = 7000
respawn_variance_ms = 1500
spawn_interval_ms = 500
spawn_batch_size = 1
retry_delay_ms = 750
spawn_visibility = "offscreen_preferred"
camera_margin_px = 128
min_player_distance_px = 320
minimum_spawn_separation_px = 128
wander_radius_px = 100
pursuit_leash_px = 256
replacement_policy = "reroll_spawn_table"

[[gameplay.mob_population.maps.zones.spawn_table]]
