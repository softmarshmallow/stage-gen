# Episode One — The Winter Room.
#
# Wednesday 27 September 1972, from 5:37 in the afternoon to after one in the
# morning. Eight beats: six scenarios and two point-and-click rooms. Nothing
# branches. What differs at the end is what Henry carries out of the building,
# and that is carried in facts.
#
# The facts below are the board. Their identifiers are frozen in ../FACTS.md and
# the consumer's autosave keys on them.

schema_version = 1
kind = "case-v1"
game_id = "the_grain"
case_id = "episode_one"
display_name = "Episode One — The Winter Room"
revision = 1
entry = "b_office"

# ---------------------------------------------------------------------- facts
#
# `required` is claimed only where the night says the thing out loud and Henry
# cannot be elsewhere: an exit condition, a line spoken to the room, a key handed
# back in front of him. Everything a player has to choose to look at is
# `defaults_false`, because the player who never looked is a player for whom it
# is simply false — which is the whole design of the episode. A thin board is a
# legitimate way to have played, not a bug.

