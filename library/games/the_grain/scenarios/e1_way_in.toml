# ----------------------------------------------------------------- the stages
# Four backdrops, all empty of people: the cast is composited into the slots.

[[stages]]
stage_id = "tollands_motor_court"
brief = "The covered motor court of a large Los Angeles department store in 1972 after closing: heavy stone piers and a stone soffit lit from beneath, a dark drive curving out to a cold blue-black street, a run of illuminated display windows along the inner wall against a dark sales floor, an unmarked service door at one end, no people, no readable text or branding"

[[stages]]
stage_id = "tollands_cosmetics_floor"
brief = "The unlit cosmetics floor of a 1972 department store after closing: glass counters, tall mirrors returning fragments of light rather than reflections, a short flight of stairs behind, everything blue-black except one distant lamp, no people, no readable text or branding"

[[stages]]
stage_id = "service_lift"
brief = "The interior of an original 1972 department-store service lift: a plain worn painted-steel car, a brass floor indicator above the gate, one dim ceiling bulb, and a wired-glass panel in the door through which a dark selling floor of furniture and hanging dresses slides past, no people, no readable text or branding"

[[stages]]
stage_id = "winter_room_evening"
brief = "A curved top-floor department-store dining room in 1972 beneath a shallow glass roof, evening: one round table at its center laid for eight under low amber lamps, a service bar to one side with a single unopened suitcase beside it, Los Angeles beyond the glass as a field of lights, no people, no readable text or branding"

