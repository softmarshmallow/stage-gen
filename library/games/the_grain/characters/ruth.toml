# Ruth Ellery. Cast bible: "About forty (inferred: Paul is 'younger by only a few
# years')." The novel gives her no physical description at all, so appearance and
# wardrobe below are authored for this production, brand-neutral and period-correct,
# and chosen to be legible at sprite scale in five-slot staging.
#
# The tells are the point. Ruth is a woman who has decided what to wear the way she
# decides a sentence: nothing accidental, nothing that asks to be looked at. She is
# dressed for the supper from the first scene onward, because she came to the office
# on her way there.

