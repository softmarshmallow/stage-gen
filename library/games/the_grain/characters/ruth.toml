[[expressions]]
expression_id = "composed"
label = "Composed"
description = "Level and unreadable, giving nothing away"
direction = "Level gaze held a beat longer than comfortable, lips closed and even, chin fractionally raised, brows still. A face that has already decided what it will show."

[[expressions]]
expression_id = "dry"
label = "Dry"
description = "The epigram landing, with no warmth behind it"
direction = "One brow a fraction higher than the other, mouth closed with a single corner drawn back, eyes steady and faintly amused without any warmth reaching them."

[[expressions]]
expression_id = "exposed"
label = "Exposed"
description = "Found out, with the composure gone all at once"
direction = "Eyes wide and fixed, lips parted, the jaw gone loose, brows lifted at the inner corners. Every arrangement dropped out of the face at once. No tears."

[[expressions]]
expression_id = "shut"
label = "Shut"
description = "Keeping the one sentence she will not give up"
direction = "Eyes lowered and turned away from the questioner, mouth pressed flat, jaw set, brows drawn very slightly together. A face closing a door and standing behind it."
