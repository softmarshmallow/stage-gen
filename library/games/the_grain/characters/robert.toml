# Robert Holt. Cast bible: grayer than his wife, broad; has known Lydia thirty years
# (he says twenty-eight); answers the telephone; drives and waits with the engine off;
# apologizes for the traffic since December 1958. The novel, Scene 3: "Robert is taking
# off his tie and explaining something about the entrance. He is broad through the
# shoulders and grayer than his wife." Lydia later "smooths the place where his tie had
# pressed into his collar."
#
# The loosened tie is the invariant. He is the book's quiet brave man and he should look
# like a man who has just parked a car.

