# Paul Ellery. Cast bible: "About thirty-six, younger than Ruth by only a few years."
# That gap is small and it matters: a player meets him for ninety minutes and then finds
# him, and a Paul drawn too young makes Ruth a mother rather than a sister. Draw him as
# a man in his middle thirties who reads younger only in the instant before he
# recognizes a room.
#
# The cream envelope rides in his inside jacket pocket and rises when he stands.

