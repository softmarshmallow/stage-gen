description = "Ruth's younger brother by only a few years, and Nell's former husband. He takes things apart carefully and leaves the pieces in the order they go back. He stops before the end of a sentence and waits for his sister. He came to say it himself, badly, once, and have it be his."
visual_identity = "Man of thirty-six, lightly built and a little under average height, with dark brown hair worn slightly long over the collar in the fashion of the year and a clean-shaven face that reads younger than it is for the half second before it recognizes a room. Warm matte skin and quick, careful hands."
