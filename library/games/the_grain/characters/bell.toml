# Mr. Bell. Cast bible: about sixty; forgets his cap and then carries it; logs doors.
# The novel, Scene 9: "Mr. Bell is waiting there in a gray guard's uniform. He is
# perhaps sixty and has forgotten to put on his cap." Later: "Bell reaches for his cap,
# remembers it is not there, and lowers his hand."
#
# The cap is the whole performance. Three of his four expressions turn on where it is,
# so the neutral plate must show the head bare and the cap in the hand.

