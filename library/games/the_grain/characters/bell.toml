display_name = "Mr. Bell"
age_years = 60
description = "The store's night guard, about sixty. He logs every door and reads them back to the night desk. He says a thing correctly and then says it again, shorter. He opened the stage door only far enough to see a face, and then locked it and called upstairs."
visual_identity = "Solid man of about sixty with a bare head of thin grey hair, a lined and honest face, and a grey moustache. Warm matte skin. He reaches for a cap that is not on his head and lowers the hand again."
wardrobe = "A plain grey guard's uniform of the period with a dark tie and plain unmarked buttons, carrying no insignia, no badge number and no lettering of any kind; a ring of keys on the belt; and a matching grey peaked cap held in one hand rather than worn."
