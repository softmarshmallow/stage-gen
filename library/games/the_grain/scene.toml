# The Grain — Episode One as one generated bundle.
#
# A scene binds several scenarios because the episode is split into six of them,
# so each one's admission proof stays under its state ceiling. The scene then
# declares the union of their stages, cast and tracks, and draws each backdrop,
# each plate and each track exactly once — a supper of eight people appears in
# four different scenarios and its actors are drawn for all four together.
#
# This document is the art half of the episode. The play order is not here: it is
# `cases/episode_one.toml`, which also carries the two point-and-click rooms that
# sit between these scenarios and generates its art through its own recipe.

schema_version = 5
kind = "dialogue-scene-v5"
game_id = "the_grain"
display_name = "The Grain — Episode One"
revision = 1
scene_brief = "Gouache painting, never photography: a 1972 farewell supper in a closed department store"
transparency_mode = "native"

# The art direction of record, as pixels rather than adjectives. Candidate 1 of a
# six-candidate sheet, selected by the production lead on 2026-09-03: the motor
# court after closing, six blank-headed mannequins facing an empty seventh chair
# beneath a paper moon. It fixes medium, palette and light for everything drawn
# here, and its digest rides each image node's cache identity — replacing the file
# is a new look and re-bills the whole episode.
#
# It is deliberately NOT an identity reference for the cast. It has no faces in it
# at all, which with nine actors to draw is protection rather than a shortfall:
# a plate showing one face would pull all nine toward it.
style_reference_id = "cover"

[[scenarios]]
schema_version = 1
kind = "scenario-binding-v1"
ref = "scenarios/e1_office.toml"
